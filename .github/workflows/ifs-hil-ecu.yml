name: IFS_HIL ECU and AMS suites (virtual)

# Runs IFS_HIL's own ECU suite, unmodified, against systems/ecu.yaml: the ECU
# built from the source the system declares (IFS_HIL's recipe), provisioned as
# the car's (the MainLite's CAN bootloader in sector 0, node 0x1), Renode
# bridged to vcan can0/can1/can2 and the virtual broker answering IFS_HIL's
# broker protocol (issue #1).

on:
  pull_request:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      suite:
        description: "IFS_HIL ECU suite name (configs/suites.yaml) or test path"
        required: false
        default: smoke
      ecu_ref:
        description: "ECU firmware ref (default: the ref in catalog/firmware/ecu.yaml)"
        required: false
      ifs_hil_ref:
        description: "IFS_HIL ref (branch, tag or SHA) whose suite runs; default dev"
        required: false
        default: dev
      ams_suite:
        description: "IFS_HIL AMS suite name (configs/suites.yaml) or test path"
        required: false
        default: full

# The jobs run code from other repos (IFS_HIL, the firmware repos): the token
# can only read this one.
permissions:
  contents: read

env:
  RENODE_VERSION: 1.17.0
  # GitHub's sha256 digest for the release asset (gh release view v1.17.0 -R
  # renode/renode --json assets), checked against a download.
  RENODE_SHA256: 4ba7c68b59e2447f188ef4b4b112fcccd2802582c460beedceb63b84e5605a5f
  # IFS_HIL's suite tracks its `dev` branch on purpose: these jobs check that
  # the bench's tests still pass against the virtual boards, so they follow
  # what the physical bench runs. Pull requests and pushes always use `dev`;
  # a dispatch may pick another ref (ifs_hil_ref). Pinning a SHA here would
  # trade that tracking for a fixed, reviewed input.
  IFS_HIL_REF: ${{ inputs.ifs_hil_ref || 'dev' }}

jobs:
  # The ECU boots through its CAN bootloader, as every MainLite does, so the
  # smoke suite's boot block (A-002 discover, A-006 round trip, A-003 flash
  # and jump through can-flasher over vcan, #4) runs here: a skip in it fails
  # the job, as it would mean the flashing path never ran.
  ecu:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CAN_FLASHER_VERSION: 3.1.1
      # GitHub's sha256 digest for the release asset (gh release view v3.1.1 -R
      # isc-fs/can-flasher --json assets), checked against a download.
      CAN_FLASHER_SHA256: 8e3412b846a3ced9abd34b9a2a5665232c2fb72f089fcf55fdcccb5635c87b5e
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Check out IFS_HIL
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          repository: isc-fs/IFS_HIL
          ref: ${{ env.IFS_HIL_REF }}
          path: ifs_hil

      - name: Arm GNU toolchain (pinned like IFS_HIL's recipe)
        uses: carlosperate/arm-none-eabi-gcc-action@98c40e51546516419841748d3210c290df0d2c6c # v1.13.0
        with:
          release: '14.2.Rel1'

      - name: Build the ECU and its bootloader from systems/ecu.yaml
        id: fw
        env:
          ECU_REF: ${{ inputs.ecu_ref }}
        run: |
          pip install -q pyyaml "jsonschema>=4"
          python -m vhil.system build systems/ecu.yaml --workdir "$RUNNER_TEMP/fw" \
            ${ECU_REF:+--ref "ecu=$ECU_REF"} | tee built.txt
          echo "elf=$(sed -n 's/^ecu=//p' built.txt)" >> "$GITHUB_OUTPUT"
          echo "bootloader=$(sed -n 's/^ecu.bootloader=//p' built.txt)" >> "$GITHUB_OUTPUT"

      - name: Install Renode ${{ env.RENODE_VERSION }}
        run: |
          curl -fsSL -o renode.tar.gz \
            "https://github.com/renode/renode/releases/download/v${RENODE_VERSION}/renode-${RENODE_VERSION}.linux-portable.tar.gz"
          echo "${RENODE_SHA256}  renode.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/renode"
          tar xzf renode.tar.gz -C "$RUNNER_TEMP/renode" --strip-components=1

      - name: Install can-flasher ${{ env.CAN_FLASHER_VERSION }}
        run: |
          curl -fsSL -o can-flasher.tar.gz \
            "https://github.com/isc-fs/can-flasher/releases/download/v${CAN_FLASHER_VERSION}/can-flasher-v${CAN_FLASHER_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${CAN_FLASHER_SHA256}  can-flasher.tar.gz" | sha256sum -c -
          tar xzf can-flasher.tar.gz -C "$RUNNER_TEMP"
          sudo install -m 0755 "$RUNNER_TEMP/can-flasher-v${CAN_FLASHER_VERSION}-x86_64-unknown-linux-gnu/can-flasher" /usr/local/bin/can-flasher
          can-flasher --version

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install IFS_HIL (core deps only, as off-bench)
        run: pip install -q -e ifs_hil

      - name: Create vcan can0 / can1 / can2
        run: |
          sudo apt-get install -y -qq "linux-modules-extra-$(uname -r)" >/dev/null
          sudo modprobe vcan
          for i in 0 1 2; do
            sudo ip link add "can$i" type vcan
            sudo ip link set "can$i" txqueuelen 1000 up
          done
          ip -br link show type vcan

      - name: Capture all CAN traffic
        run: |
          sudo apt-get install -y -qq can-utils >/dev/null
          nohup candump -L -t a can0 can1 can2 > candump.log 2>&1 &

      - name: Run IFS_HIL's ECU suite against the virtual ECU
        env:
          SUITE: ${{ inputs.suite || 'smoke' }}
          RENODE: ${{ runner.temp }}/renode/renode
          VHIL_FIRMWARE: ecu.bootloader=${{ steps.fw.outputs.bootloader }}
          ECU_ELF: ${{ steps.fw.outputs.elf }}
        run: |
          set +e
          scripts/run-ifs-hil.sh ifs_hil "$ECU_ELF" "$SUITE" \
            --vhil-log="$GITHUB_WORKSPACE/vhil-renode.log" \
            --junitxml="$GITHUB_WORKSPACE/junit.xml" | tee pytest.txt
          rc=${PIPESTATUS[0]}
          # A missing bus must never pass as a skip.
          if grep -q "SocketCAN interface .* not present" pytest.txt; then
            echo "::error::tests skipped for a missing SocketCAN interface"; exit 1
          fi
          if grep -q "^SKIPPED.*test_block_a_boot" pytest.txt; then
            echo "::error::a boot-block test skipped: the flashing path did not run"; exit 1
          fi
          exit $rc

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ifs-hil-ecu-virtual
          path: |
            junit.xml
            pytest.txt
            vhil-renode.log
            candump.log
          if-no-files-found: ignore

  # M3 (#11): the ECU and the AMS on one ACU bus (systems/ecu-ams.yaml), and
  # IFS_HIL's real-AMS block against the emulated AMS. Every test must run:
  # a skip here means the live AMS was not there.
  ecu-ams:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Check out IFS_HIL
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          repository: isc-fs/IFS_HIL
          ref: ${{ env.IFS_HIL_REF }}
          path: ifs_hil

      - name: Arm GNU toolchain (pinned like IFS_HIL's recipe)
        uses: carlosperate/arm-none-eabi-gcc-action@98c40e51546516419841748d3210c290df0d2c6c # v1.13.0
        with:
          release: '14.2.Rel1'

      - name: Build the ECU and AMS firmware from systems/ecu-ams.yaml
        id: fw
        env:
          ECU_REF: ${{ inputs.ecu_ref }}
        run: |
          pip install -q pyyaml "jsonschema>=4"
          python -m vhil.system build systems/ecu-ams.yaml --workdir "$RUNNER_TEMP/fw" \
            ${ECU_REF:+--ref "ecu=$ECU_REF"} | tee built.txt
          echo "ecu=$(sed -n 's/^ecu=//p' built.txt)" >> "$GITHUB_OUTPUT"
          echo "ams=$(sed -n 's/^ams=//p' built.txt)" >> "$GITHUB_OUTPUT"
          echo "bootloader=$(sed -n 's/^ecu.bootloader=//p' built.txt)" >> "$GITHUB_OUTPUT"

      - name: Install Renode ${{ env.RENODE_VERSION }}
        run: |
          curl -fsSL -o renode.tar.gz \
            "https://github.com/renode/renode/releases/download/v${RENODE_VERSION}/renode-${RENODE_VERSION}.linux-portable.tar.gz"
          echo "${RENODE_SHA256}  renode.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/renode"
          tar xzf renode.tar.gz -C "$RUNNER_TEMP/renode" --strip-components=1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install IFS_HIL (core deps only, as off-bench)
        run: pip install -q -e ifs_hil

      - name: Create vcan can0 / can1 / can2
        run: |
          sudo apt-get install -y -qq "linux-modules-extra-$(uname -r)" can-utils >/dev/null
          sudo modprobe vcan
          for i in 0 1 2; do
            sudo ip link add "can$i" type vcan
            sudo ip link set "can$i" txqueuelen 1000 up
          done
          nohup candump -L -t a can0 can1 can2 > candump.log 2>&1 &

      - name: Run IFS_HIL's real-AMS block against the virtual ECU + AMS
        env:
          RENODE: ${{ runner.temp }}/renode/renode
          VHIL_SYSTEM: systems/ecu-ams.yaml
          VHIL_FIRMWARE: >-
            ams=${{ steps.fw.outputs.ams }}
            ecu.bootloader=${{ steps.fw.outputs.bootloader }}
            ams.bootloader=${{ steps.fw.outputs.bootloader }}
          ECU_ELF: ${{ steps.fw.outputs.ecu }}
        run: |
          set +e
          scripts/run-ifs-hil.sh ifs_hil "$ECU_ELF" \
            tests/hil/vcu/test_block_f_real_ams.py \
            --vhil-log="$GITHUB_WORKSPACE/vhil-renode.log" \
            --junitxml="$GITHUB_WORKSPACE/junit.xml" | tee pytest.txt
          rc=${PIPESTATUS[0]}
          if grep -q "^SKIPPED" pytest.txt; then
            echo "::error::a real-AMS test skipped: the live AMS was not exercised"; exit 1
          fi
          exit $rc

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ifs-hil-ecu-ams-virtual
          path: |
            junit.xml
            pytest.txt
            vhil-renode.log
            candump.log
          if-no-files-found: ignore

  # IFS_HIL's AMS suite (`full`, minus its soak cases: IFS_HIL pyproject.toml
  # addopts) against systems/ams.yaml: the AMS built from the source the
  # system declares, behind its CAN bootloader (node 0x2, flashed over
  # FDCAN1), with bench-01's AMS-slot wiring (relay, INA, DAC4 pack-current
  # pair, IOEXP2 TSMS/DASH_CHG, ADC3 relay readback, the Pico's cell seed).
  # What the virtual bench can't run yet is skipped with its reason from
  # configs/gaps.yaml.
  ams:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      CAN_FLASHER_VERSION: 3.1.1
      CAN_FLASHER_SHA256: 8e3412b846a3ced9abd34b9a2a5665232c2fb72f089fcf55fdcccb5635c87b5e
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Check out IFS_HIL
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          repository: isc-fs/IFS_HIL
          ref: ${{ env.IFS_HIL_REF }}
          path: ifs_hil

      - name: Arm GNU toolchain (pinned like IFS_HIL's recipe)
        uses: carlosperate/arm-none-eabi-gcc-action@98c40e51546516419841748d3210c290df0d2c6c # v1.13.0
        with:
          release: '14.2.Rel1'

      - name: Build the AMS and its bootloader from systems/ams.yaml
        id: fw
        run: |
          pip install -q pyyaml "jsonschema>=4"
          python -m vhil.system build systems/ams.yaml --workdir "$RUNNER_TEMP/fw" | tee built.txt
          echo "elf=$(sed -n 's/^ams=//p' built.txt)" >> "$GITHUB_OUTPUT"
          echo "bootloader=$(sed -n 's/^ams.bootloader=//p' built.txt)" >> "$GITHUB_OUTPUT"

      - name: Install Renode ${{ env.RENODE_VERSION }}
        run: |
          curl -fsSL -o renode.tar.gz \
            "https://github.com/renode/renode/releases/download/v${RENODE_VERSION}/renode-${RENODE_VERSION}.linux-portable.tar.gz"
          echo "${RENODE_SHA256}  renode.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/renode"
          tar xzf renode.tar.gz -C "$RUNNER_TEMP/renode" --strip-components=1

      - name: Install can-flasher ${{ env.CAN_FLASHER_VERSION }}
        run: |
          curl -fsSL -o can-flasher.tar.gz \
            "https://github.com/isc-fs/can-flasher/releases/download/v${CAN_FLASHER_VERSION}/can-flasher-v${CAN_FLASHER_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${CAN_FLASHER_SHA256}  can-flasher.tar.gz" | sha256sum -c -
          tar xzf can-flasher.tar.gz -C "$RUNNER_TEMP"
          sudo install -m 0755 "$RUNNER_TEMP/can-flasher-v${CAN_FLASHER_VERSION}-x86_64-unknown-linux-gnu/can-flasher" /usr/local/bin/can-flasher
          can-flasher --version

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      # pytest-rerunfailures: see the rerun note on the run step.
      - name: Install IFS_HIL (core deps only, as off-bench)
        run: pip install -q -e ifs_hil "pytest-rerunfailures==16.7"

      - name: Create vcan can0 / can1 / can2
        run: |
          sudo apt-get install -y -qq "linux-modules-extra-$(uname -r)" can-utils >/dev/null
          sudo modprobe vcan
          for i in 0 1 2; do
            sudo ip link add "can$i" type vcan
            sudo ip link set "can$i" txqueuelen 1000 up
          done
          nohup candump -L -t a can0 can1 can2 > candump.log 2>&1 &

      # A failed case is run once more before it fails the job. IFS_HIL times
      # the bench by the wall clock, and a virtual power-on runs slower than
      # real time (#154): each CI run so far lost a different one or two cases
      # to a sub-second window after a boot (C-039a, C-049, F-060, E-064,
      # N-004, U-160), every one of them passing locally and in the other
      # runs. A case that fails twice is a real failure. The reruns show in
      # the report as RERUN.
      - name: Run IFS_HIL's AMS suite against the virtual AMS
        env:
          SUITE: ${{ inputs.ams_suite || 'full' }}
          RENODE: ${{ runner.temp }}/renode/renode
          VHIL_DUT: ams
          VHIL_FIRMWARE: ams.bootloader=${{ steps.fw.outputs.bootloader }}
          AMS_ELF: ${{ steps.fw.outputs.elf }}
        run: |
          set +e
          scripts/run-ifs-hil.sh ifs_hil "$AMS_ELF" "$SUITE" \
            --vhil-log="$GITHUB_WORKSPACE/vhil-renode.log" \
            --junitxml="$GITHUB_WORKSPACE/junit.xml" --durations=25 --reruns 1 | tee pytest.txt
          rc=${PIPESTATUS[0]}
          if grep -q "SocketCAN interface .* not present" pytest.txt; then
            echo "::error::tests skipped for a missing SocketCAN interface"; exit 1
          fi
          exit $rc

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ifs-hil-ams-virtual
          path: |
            junit.xml
            pytest.txt
            vhil-renode.log
            candump.log
          if-no-files-found: ignore
