name: Native tests (virtual time)

# Builds the firmware each system declares, then runs tests/sim on Renode
# through vhil.sim: assertions on virtual timestamps, not wall clock.
# Sharded by suite so the whole set doesn't serialise every PR; the `sim`
# job (the required check) passes only when every shard did.

on:
  pull_request:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

env:
  RENODE_VERSION: 1.17.0
  # GitHub's sha256 digest for the release asset (gh release view v1.17.0 -R
  # renode/renode --json assets), checked against a download.
  RENODE_SHA256: 4ba7c68b59e2447f188ef4b4b112fcccd2802582c460beedceb63b84e5605a5f

jobs:
  shard:
    name: sim (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # <group>-<k>: the group's test files, sorted, round-robin over its
        # shards (ams 3, ecu 2), so each stays well inside the timeout as
        # suites are added (sim (ams) alone had reached 42 of 45 min).
        # Flashing over CAN at the bus rate is minutes of emulation per image,
        # so the *bootloader* files get shards of their own: ams-bootloader,
        # and bootloader (the rest).
        shard: [ams-1, ams-2, ams-3, ecu-1, ecu-2, ams-bootloader, bootloader, other]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Arm GNU toolchain (pinned like IFS_HIL's recipe)
        uses: carlosperate/arm-none-eabi-gcc-action@98c40e51546516419841748d3210c290df0d2c6c # v1.13.0
        with:
          release: '14.2.Rel1'

      - name: Build the ECU and AMS firmware their systems declare
        id: fw
        run: |
          pip install -q pyyaml "jsonschema>=4" pytest "fastapi==0.115.*" "httpx==0.28.*"
          for s in ecu ams; do
            python -m vhil.system build "systems/$s.yaml" --workdir "$RUNNER_TEMP/fw" | tee -a built.txt
          done
          echo "ecu=$(sed -n 's/^ecu=//p' built.txt | tail -1)" >> "$GITHUB_OUTPUT"
          echo "ams=$(sed -n 's/^ams=//p' built.txt | tail -1)" >> "$GITHUB_OUTPUT"
          echo "bootloader=$(sed -n 's/^ecu.bootloader=//p' built.txt | tail -1)" >> "$GITHUB_OUTPUT"

      - name: Install Renode ${{ env.RENODE_VERSION }}
        run: |
          curl -fsSL -o renode.tar.gz \
            "https://github.com/renode/renode/releases/download/v${RENODE_VERSION}/renode-${RENODE_VERSION}.linux-portable.tar.gz"
          echo "${RENODE_SHA256}  renode.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/renode"
          tar xzf renode.tar.gz -C "$RUNNER_TEMP/renode" --strip-components=1

      - name: FAT tools for SD card images
        run: sudo apt-get install -y -qq dosfstools mtools >/dev/null

      - name: Run this shard of tests/sim
        env:
          RENODE: ${{ runner.temp }}/renode/renode
          VHIL_ECU_ELF: ${{ steps.fw.outputs.ecu }}
          VHIL_AMS_ELF: ${{ steps.fw.outputs.ams }}
          VHIL_CAN_BOOTLOADER_ELF: ${{ steps.fw.outputs.bootloader }}
          SHARD: ${{ matrix.shard }}
        run: |
          # ams-k: test_ams_*, ecu-k: test_ecu_*, other: every other test file.
          bl='bootloader'
          case "$SHARD" in
            ams-bootloader) all=tests/sim/test_ams_bootloader.py; n=1 ;;
            bootloader) all=$(ls tests/sim/test_*.py | grep "$bl" | grep -v '/test_ams_'); n=1 ;;
            ams-*) all=$(ls tests/sim/test_ams_*.py | grep -v "$bl"); n=3 ;;
            ecu-*) all=$(ls tests/sim/test_ecu_*.py | grep -v "$bl"); n=2 ;;
            other) all=$(ls tests/sim/test_*.py | grep -v -e '/test_ams_' -e '/test_ecu_' -e "$bl"); n=1 ;;
          esac
          k=${SHARD##*-}; case "$k" in [0-9]*) ;; *) k=1 ;; esac
          files=$(echo "$all" | sort | awk -v n="$n" -v k="$k" '(NR - 1) % n == k - 1')
          echo "$files"
          python -m pytest $files -v --sim-log-dir sim-logs

      - name: Emulation speed on this runner
        if: always() && matrix.shard == 'ecu-1'
        env:
          RENODE: ${{ runner.temp }}/renode/renode
          ECU_ELF: ${{ steps.fw.outputs.ecu }}
          BL_ELF: ${{ steps.fw.outputs.bootloader }}
        run: |
          nproc
          python scripts/speed.py systems/ecu.yaml "ecu=$ECU_ELF" "ecu.bootloader=$BL_ELF" \
            --mips 100 528 \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload Renode logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sim-logs-${{ matrix.shard }}
          path: sim-logs/
          if-no-files-found: ignore

  sim:
    needs: shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every shard passed
        env:
          RESULT: ${{ needs.shard.result }}
        run: test "$RESULT" = success
