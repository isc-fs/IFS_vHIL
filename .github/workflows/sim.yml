name: Native tests (virtual time)

# Builds the firmware each system declares, then runs tests/sim on Renode
# through vhil.sim: assertions on virtual timestamps, not wall clock.
# Sharded by suite so the whole set doesn't serialise every PR; the `sim`
# job (the required check) passes only when every shard did.

# Heavy CI runs only in special cases (owner, 2026-10-06): a pull request
# labelled `full-ci`, a release pull request into main, the nightly run on
# dev, or a manual dispatch. Otherwise the jobs are skipped, which counts as
# passing for required checks; unit tests (unit.yml) run on every pull request.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: '30 2 * * *'   # nightly, on dev (see the checkout ref)
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RENODE_VERSION: 1.17.0
  # GitHub's sha256 digest for the release asset (gh release view v1.17.0 -R
  # renode/renode --json assets), checked against a download.
  RENODE_SHA256: 4ba7c68b59e2447f188ef4b4b112fcccd2802582c460beedceb63b84e5605a5f

jobs:
  shard:
    name: sim (${{ matrix.shard }})
    if: github.event_name != 'pull_request' || github.base_ref == 'main' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # <group>-<k>: the group's test files, sorted, round-robin over its
        # shards (ams 3, ecu 2, other 2), so each stays well inside the
        # timeout as suites are added. Each shard runs its files two at a
        # time (scripts/sim-shard.sh): one emulated system keeps one to two
        # of the runner's 4 cores busy, so two run at nearly twice the rate
        # (#260; it was 15 shards of one file at a time, 156 runner-minutes,
        # the longest 17). Every boot spends the bootloader's 2 s window
        # first; its FDCAN polling loop is fast-forwarded (#154,
        # docs/performance.md). Flashing over CAN at the bus rate is minutes
        # of emulation per image, so the *bootloader* files get a shard of
        # their own.
        shard: [ams-1, ams-2, ams-3, ecu-1, ecu-2, bootloader, other-1, other-2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'schedule' && 'dev' || '' }}
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Arm GNU toolchain (pinned like IFS_HIL's recipe)
        uses: carlosperate/arm-none-eabi-gcc-action@98c40e51546516419841748d3210c290df0d2c6c # v1.13.0
        with:
          release: '14.2.Rel1'

      - name: Build the ECU and AMS firmware their systems declare
        id: fw
        run: |
          pip install -q pyyaml "jsonschema>=4" pytest "fastapi==0.115.*" "httpx==0.28.*"
          for s in ecu ams; do
            python -m vhil.system build "systems/$s.yaml" --workdir "$RUNNER_TEMP/fw" | tee -a built.txt
          done
          echo "ecu=$(sed -n 's/^ecu=//p' built.txt | tail -1)" >> "$GITHUB_OUTPUT"
          echo "ams=$(sed -n 's/^ams=//p' built.txt | tail -1)" >> "$GITHUB_OUTPUT"
          echo "bootloader=$(sed -n 's/^ecu.bootloader=//p' built.txt | tail -1)" >> "$GITHUB_OUTPUT"

      - name: Install Renode ${{ env.RENODE_VERSION }}
        run: |
          curl -fsSL -o renode.tar.gz \
            "https://github.com/renode/renode/releases/download/v${RENODE_VERSION}/renode-${RENODE_VERSION}.linux-portable.tar.gz"
          echo "${RENODE_SHA256}  renode.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/renode"
          tar xzf renode.tar.gz -C "$RUNNER_TEMP/renode" --strip-components=1

      - name: FAT tools for SD card images
        run: sudo apt-get install -y -qq dosfstools mtools >/dev/null

      # The debugger's tests (tests/sim/test_debugger.py, an `other` file):
      # the toolchain's arm-none-eabi-gdb links libncurses.so.5, which
      # ubuntu-latest no longer has, so they use gdb-multiarch (VHIL_GDB).
      - name: GDB for the debugger tests
        if: startsWith(matrix.shard, 'other')
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq gdb-multiarch >/dev/null
          echo "VHIL_GDB=$(command -v gdb-multiarch)" >> "$GITHUB_ENV"

      - name: Run this shard of tests/sim
        env:
          RENODE: ${{ runner.temp }}/renode/renode
          VHIL_ECU_ELF: ${{ steps.fw.outputs.ecu }}
          VHIL_AMS_ELF: ${{ steps.fw.outputs.ams }}
          VHIL_CAN_BOOTLOADER_ELF: ${{ steps.fw.outputs.bootloader }}
          SHARD: ${{ matrix.shard }}
        run: |
          # ams-k: test_ams_*, ecu-k: test_ecu_*, other-k: every other test file.
          bl='bootloader'
          case "$SHARD" in
            bootloader) all=$(ls tests/sim/test_*.py | grep "$bl"); n=1 ;;
            ams-*) all=$(ls tests/sim/test_ams_*.py | grep -v "$bl"); n=3 ;;
            ecu-*) all=$(ls tests/sim/test_ecu_*.py | grep -v "$bl"); n=2 ;;
            other-*) all=$(ls tests/sim/test_*.py | grep -v -e '/test_ams_' -e '/test_ecu_' -e "$bl"); n=2 ;;
          esac
          k=${SHARD##*-}; case "$k" in [0-9]*) ;; *) k=1 ;; esac
          files=$(echo "$all" | sort | awk -v n="$n" -v k="$k" '(NR - 1) % n == k - 1')
          echo "$files"
          scripts/sim-shard.sh 2 sim-logs $files

      - name: Upload Renode logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sim-logs-${{ matrix.shard }}
          path: sim-logs/
          if-no-files-found: ignore

  # The bench's real-time factor on this runner (#154): every system, the
  # wall-clock bench's emulation and lock-step vhil.sim, boot and steady
  # state, and the same again as before #154's speed-ups (--baseline), so
  # one run gives both on the same host. Recorded in the job summary and as
  # an artifact; it fails only if the benchmark can't run.
  speed:
    name: emulation speed
    if: github.event_name != 'pull_request' || github.base_ref == 'main' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'schedule' && 'dev' || '' }}
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Arm GNU toolchain (pinned like IFS_HIL's recipe)
        uses: carlosperate/arm-none-eabi-gcc-action@98c40e51546516419841748d3210c290df0d2c6c # v1.13.0
        with:
          release: '14.2.Rel1'

      - name: Build the ECU and AMS firmware their systems declare
        id: fw
        run: |
          pip install -q pyyaml "jsonschema>=4"
          for s in ecu ams; do
            python -m vhil.system build "systems/$s.yaml" --workdir "$RUNNER_TEMP/fw" | tee -a built.txt
          done
          echo "ecu=$(sed -n 's/^ecu=//p' built.txt | tail -1)" >> "$GITHUB_OUTPUT"
          echo "ams=$(sed -n 's/^ams=//p' built.txt | tail -1)" >> "$GITHUB_OUTPUT"
          echo "bootloader=$(sed -n 's/^ecu.bootloader=//p' built.txt | tail -1)" >> "$GITHUB_OUTPUT"

      - name: Install Renode ${{ env.RENODE_VERSION }}
        run: |
          curl -fsSL -o renode.tar.gz \
            "https://github.com/renode/renode/releases/download/v${RENODE_VERSION}/renode-${RENODE_VERSION}.linux-portable.tar.gz"
          echo "${RENODE_SHA256}  renode.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/renode"
          tar xzf renode.tar.gz -C "$RUNNER_TEMP/renode" --strip-components=1

      - name: Real-time factor on this runner
        env:
          RENODE: ${{ runner.temp }}/renode/renode
          ECU_ELF: ${{ steps.fw.outputs.ecu }}
          AMS_ELF: ${{ steps.fw.outputs.ams }}
          BL_ELF: ${{ steps.fw.outputs.bootloader }}
        run: |
          nproc
          python scripts/speed.py "ecu=$ECU_ELF" "ams=$AMS_ELF" "bootloader=$BL_ELF" \
            --baseline --json speed/speed.json --log-dir speed/logs \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: emulation-speed
          path: speed/
          if-no-files-found: ignore

  sim:
    needs: shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every shard passed
        env:
          RESULT: ${{ needs.shard.result }}
        # skipped when this run is not one of the special cases above
        run: test "$RESULT" = success || test "$RESULT" = skipped
