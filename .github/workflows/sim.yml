name: Native tests (virtual time)

# Builds the firmware each system declares, then runs tests/sim on Renode
# through vhil.sim: assertions on virtual timestamps, not wall clock.
# Sharded by suite so the whole set doesn't serialise every PR; the `sim`
# job (the required check) passes only when every shard did.

# Heavy CI runs only in special cases (owner, 2026-10-06; docs/ci.md): a
# pull request labelled `full-ci` runs the files its changes select
# (ci/impact.yaml) plus the guard, `full-ci-all`, a release pull request into
# main, the nightly run on dev and a manual dispatch run everything.
# Otherwise the jobs are skipped, which counts as passing for required
# checks; unit tests (unit.yml) run on every pull request.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: '30 2 * * *'   # nightly, on dev (see the checkout ref)
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # What this event runs (scripts/ci-select.py over ci/impact.yaml).
  select:
    uses: ./.github/workflows/select.yml

  # Renode as the image builds it (docker/renode/,
  # .github/actions/setup-renode), into the Actions cache once; the jobs below
  # read it from there.
  renode:
    name: renode build
    needs: select
    if: needs.select.outputs.renode_sim == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'schedule' && 'dev' || '' }}
          persist-credentials: false
      - uses: ./.github/actions/setup-renode
        with:
          save: 'true'

  shard:
    name: sim (${{ matrix.shard }})
    needs: [select, renode]
    # After the build, which a failed `renode` doesn't skip: the job then
    # builds Renode itself (and fails loudly if it can't).
    if: ${{ !cancelled() && needs.select.result == 'success' && needs.select.outputs.sim == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Shard k of N runs the files scripts/sim-balance.py gives it: split
        # by each file's wall time on CI (tests/sim/durations.json, from the
        # per-file tables sim-shard.sh writes to the job summaries), longest
        # first, so the shards end together. Each shard runs its files two at
        # a time (scripts/sim-shard.sh): one emulated system keeps one to two
        # of the runner's 4 cores busy, so two run at nearly twice the rate
        # (#260; it was 15 shards of one file at a time, 156 runner-minutes,
        # the longest 17). Every boot spends the bootloader's 2 s window
        # first; its FDCAN polling loop is fast-forwarded (#154,
        # docs/performance.md). N is 8 for a full run, fewer for an impact
        # selection (scripts/ci-select.py: as many as keep each lane within a
        # full run's).
        shard: ${{ fromJSON(needs.select.outputs.sim_shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'schedule' && 'dev' || '' }}
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Arm GNU toolchain (pinned like IFS_HIL's recipe)
        uses: carlosperate/arm-none-eabi-gcc-action@0edbb000a5a98e2292b051b463bff6f512547118 # v1.14.0
        with:
          release: '14.2.Rel1'

      - name: Build the ECU, AMS and uDV firmware their systems declare
        id: fw
        run: |
          pip install -q pyyaml "jsonschema>=4" pytest "fastapi==0.115.*" "httpx==0.28.*"
          for s in ecu ams udv; do
            python -m vhil.system build "systems/$s.yaml" --workdir "$RUNNER_TEMP/fw" | tee -a built.txt
          done
          echo "ecu=$(sed -n 's/^ecu=//p' built.txt | tail -1)" >> "$GITHUB_OUTPUT"
          echo "ams=$(sed -n 's/^ams=//p' built.txt | tail -1)" >> "$GITHUB_OUTPUT"
          echo "udv=$(sed -n 's/^udv=//p' built.txt | tail -1)" >> "$GITHUB_OUTPUT"
          echo "bootloader=$(sed -n 's/^ecu.bootloader=//p' built.txt | tail -1)" >> "$GITHUB_OUTPUT"

      # Renode 1.17.0 + docker/renode's patches, as the image builds it.
      - name: Renode (vHIL build)
        uses: ./.github/actions/setup-renode

      - name: FAT tools for SD card images
        run: sudo apt-get install -y -qq dosfstools mtools >/dev/null

      - name: This shard's test files
        id: files
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ needs.select.outputs.sim_shard_count }}
          SELECTED: ${{ needs.select.outputs.sim_files }}
        run: |
          files=$(python scripts/sim-balance.py "$SHARDS" "$SHARD" --files "$SELECTED")
          echo "$files"
          echo "list=$(echo $files)" >> "$GITHUB_OUTPUT"

      # The debugger's tests (tests/sim/test_debugger.py): the toolchain's
      # arm-none-eabi-gdb links libncurses.so.5, which ubuntu-latest no
      # longer has, so they use gdb-multiarch (VHIL_GDB).
      - name: GDB for the debugger tests
        if: contains(steps.files.outputs.list, 'test_debugger')
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq gdb-multiarch >/dev/null
          echo "VHIL_GDB=$(command -v gdb-multiarch)" >> "$GITHUB_ENV"

      - name: Run this shard of tests/sim
        env:
          # The nightly also maps what each file exercises (docs/ci.md, the
          # impact audit).
          VHIL_IMPACT_MAP: ${{ github.event_name == 'schedule' && '1' || '0' }}
          RENODE: ${{ runner.temp }}/renode/renode
          VHIL_ECU_ELF: ${{ steps.fw.outputs.ecu }}
          VHIL_AMS_ELF: ${{ steps.fw.outputs.ams }}
          VHIL_UDV_ELF: ${{ steps.fw.outputs.udv }}
          VHIL_CAN_BOOTLOADER_ELF: ${{ steps.fw.outputs.bootloader }}
          FILES: ${{ steps.files.outputs.list }}
        run: |
          if [ "$VHIL_IMPACT_MAP" = 1 ]; then pip install -q "coverage==7.6.*"; fi
          scripts/sim-shard.sh 2 sim-logs $FILES

      - name: Upload Renode logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sim-logs-${{ matrix.shard }}
          path: sim-logs/
          if-no-files-found: ignore

  # The bench's real-time factor on this runner (#154): every system (and
  # ecu-ams-ecu, the three-board benchmark, scripts/speed-systems/), the
  # wall-clock bench's emulation and lock-step vhil.sim, boot and steady
  # state, and the same again as before #154's speed-ups (--baseline), so
  # one run gives both on the same host. Recorded in the job summary and as
  # an artifact; it fails only if the benchmark can't run.
  speed:
    name: emulation speed
    needs: [select, renode]
    # After the build, which a failed `renode` doesn't skip: the job then
    # builds Renode itself (and fails loudly if it can't).
    if: ${{ !cancelled() && needs.select.result == 'success' && needs.select.outputs.speed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'schedule' && 'dev' || '' }}
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Arm GNU toolchain (pinned like IFS_HIL's recipe)
        uses: carlosperate/arm-none-eabi-gcc-action@0edbb000a5a98e2292b051b463bff6f512547118 # v1.14.0
        with:
          release: '14.2.Rel1'

      - name: Build the ECU, AMS and uDV firmware their systems declare
        id: fw
        run: |
          pip install -q pyyaml "jsonschema>=4"
          for s in ecu ams udv; do
            python -m vhil.system build "systems/$s.yaml" --workdir "$RUNNER_TEMP/fw" | tee -a built.txt
          done
          echo "ecu=$(sed -n 's/^ecu=//p' built.txt | tail -1)" >> "$GITHUB_OUTPUT"
          echo "ams=$(sed -n 's/^ams=//p' built.txt | tail -1)" >> "$GITHUB_OUTPUT"
          echo "udv=$(sed -n 's/^udv=//p' built.txt | tail -1)" >> "$GITHUB_OUTPUT"
          echo "bootloader=$(sed -n 's/^ecu.bootloader=//p' built.txt | tail -1)" >> "$GITHUB_OUTPUT"

      # Renode 1.17.0 + docker/renode's patches, as the image builds it.
      - name: Renode (vHIL build)
        uses: ./.github/actions/setup-renode

      - name: Real-time factor on this runner
        env:
          RENODE: ${{ runner.temp }}/renode/renode
          ECU_ELF: ${{ steps.fw.outputs.ecu }}
          AMS_ELF: ${{ steps.fw.outputs.ams }}
          UDV_ELF: ${{ steps.fw.outputs.udv }}
          BL_ELF: ${{ steps.fw.outputs.bootloader }}
        run: |
          nproc
          # Three boards: the car's ecu-ams-udv (it replaced the ecu-ams-ecu
          # benchmark here once the uDV had a firmware).
          python scripts/speed.py "ecu=$ECU_ELF" "ams=$AMS_ELF" "udv=$UDV_ELF" "bootloader=$BL_ELF" \
            --systems ams ecu udv ecu-ams ecu-ams-udv --threads \
            --baseline --json speed/speed.json --log-dir speed/logs \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: emulation-speed
          path: speed/
          if-no-files-found: ignore

  # The guard every heavy run has, whatever the selection (docs/ci.md): each
  # system's identity fingerprint against ci/fingerprints.json, on the
  # firmware commits that file pins, and the two-board determinism test. A
  # change the selection left tests out for must still leave every system's
  # first seconds byte-identical (or re-record the references).
  guard:
    name: impact guard
    needs: [select, renode]
    if: ${{ !cancelled() && needs.select.result == 'success' && needs.select.outputs.guard == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'schedule' && 'dev' || '' }}
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Arm GNU toolchain (pinned like IFS_HIL's recipe)
        uses: carlosperate/arm-none-eabi-gcc-action@0edbb000a5a98e2292b051b463bff6f512547118 # v1.14.0
        with:
          release: '14.2.Rel1'

      - name: Build the firmware ci/fingerprints.json pins
        id: fw
        run: |
          pip install -q pyyaml "jsonschema>=4" pytest "fastapi==0.115.*" "httpx==0.28.*"
          commits=$(python - <<'EOF'
          import json
          fw = json.load(open("ci/fingerprints.json"))["firmware"]
          pairs = [f"{b}={fw[b]}" for b in ("ecu", "ams", "udv")]
          pairs += [f"{b}.bootloader={fw['can-bootloader']}" for b in ("ecu", "ams", "udv")]
          print(" ".join(f"--commit {p}" for p in pairs))
          EOF
          )
          python -m vhil.system build systems/ecu-ams-udv.yaml --workdir "$RUNNER_TEMP/fw" $commits | tee built.txt
          echo "ecu=$(sed -n 's/^ecu=//p' built.txt | tail -1)" >> "$GITHUB_OUTPUT"
          echo "ams=$(sed -n 's/^ams=//p' built.txt | tail -1)" >> "$GITHUB_OUTPUT"
          echo "udv=$(sed -n 's/^udv=//p' built.txt | tail -1)" >> "$GITHUB_OUTPUT"
          echo "bootloader=$(sed -n 's/^ecu.bootloader=//p' built.txt | tail -1)" >> "$GITHUB_OUTPUT"

      # Renode 1.17.0 + docker/renode's patches, as the image builds it.
      - name: Renode (vHIL build)
        uses: ./.github/actions/setup-renode

      - name: FAT tools for SD card images
        run: sudo apt-get install -y -qq dosfstools mtools >/dev/null

      - name: Identity fingerprint of every system
        id: fingerprint
        env:
          RENODE: ${{ runner.temp }}/renode/renode
          VHIL_ECU_ELF: ${{ steps.fw.outputs.ecu }}
          VHIL_AMS_ELF: ${{ steps.fw.outputs.ams }}
          VHIL_UDV_ELF: ${{ steps.fw.outputs.udv }}
          VHIL_CAN_BOOTLOADER_ELF: ${{ steps.fw.outputs.bootloader }}
        run: |
          mkdir -p fingerprint
          set +e
          python scripts/fingerprint.py check ci/fingerprints.json \
            --out fingerprint/fingerprints.json --full fingerprint/observed.json | tee fingerprint/check.txt
          rc=${PIPESTATUS[0]}
          {
            echo "## Identity fingerprint (ci/fingerprints.json)"
            echo '```'
            cat fingerprint/check.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      - name: Two-board determinism
        if: ${{ !cancelled() }}
        env:
          RENODE: ${{ runner.temp }}/renode/renode
          VHIL_ECU_ELF: ${{ steps.fw.outputs.ecu }}
          VHIL_AMS_ELF: ${{ steps.fw.outputs.ams }}
          VHIL_CAN_BOOTLOADER_ELF: ${{ steps.fw.outputs.bootloader }}
        run: |
          set -o pipefail
          python -m pytest -v -rs --sim-log-dir sim-logs \
            "tests/sim/test_can_bus.py::test_two_board_runs_give_the_same_bus_timeline" | tee det.txt
          # A skip (a missing image) must not pass as the guard.
          grep -qE "^=+ 1 passed" det.txt

      - name: Upload the fingerprint (commit fingerprint/fingerprints.json to re-record)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fingerprint
          path: |
            fingerprint/
            sim-logs/
          if-no-files-found: ignore

  # The required check: the selection ran, every shard it selected passed,
  # and the guard did. Skipped jobs pass only when the selection skipped
  # them; a failed selection fails this check rather than letting it pass.
  sim:
    needs: [select, shard, guard]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: The selection, every shard and the guard passed
        env:
          SELECT: ${{ needs.select.result }}
          SHARDS: ${{ needs.shard.result }}
          GUARD: ${{ needs.guard.result }}
          SIM: ${{ needs.select.outputs.sim }}
          HEAVY: ${{ needs.select.outputs.guard }}
        run: |
          echo "select=$SELECT shards=$SHARDS (selected: $SIM) guard=$GUARD (selected: $HEAVY)"
          test "$SELECT" = success
          if [ "$SIM" = true ]; then test "$SHARDS" = success; else test "$SHARDS" = skipped; fi
          if [ "$HEAVY" = true ]; then test "$GUARD" = success; else test "$GUARD" = skipped; fi
