name: Native tests (virtual time)

# Builds the firmware each system declares, then runs tests/sim on Renode
# through vhil.sim: assertions on virtual timestamps, not wall clock.
# Sharded by suite so the whole set doesn't serialise every PR; the `sim`
# job (the required check) passes only when every shard did.

on:
  pull_request:
  push:
    branches: [dev]
  workflow_dispatch:

env:
  RENODE_VERSION: 1.17.0

jobs:
  shard:
    name: sim (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [ams, ecu, ams-bootloader, bootloader, other]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Arm GNU toolchain (pinned like IFS_HIL's recipe)
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '14.2.Rel1'

      - name: Build the ECU and AMS firmware their systems declare
        id: fw
        run: |
          pip install -q pyyaml "jsonschema>=4" pytest
          for s in ecu ams ecu-bl; do
            python -m vhil.system build "systems/$s.yaml" --workdir "$RUNNER_TEMP/fw" | tee -a built.txt
          done
          echo "ecu=$(sed -n 's/^ecu=//p' built.txt | tail -1)" >> "$GITHUB_OUTPUT"
          echo "ams=$(sed -n 's/^ams=//p' built.txt | tail -1)" >> "$GITHUB_OUTPUT"
          echo "bootloader=$(sed -n 's/^ecu.bootloader=//p' built.txt | tail -1)" >> "$GITHUB_OUTPUT"

      - name: Install Renode ${{ env.RENODE_VERSION }}
        run: |
          curl -sSL -o renode.tar.gz \
            "https://github.com/renode/renode/releases/download/v${RENODE_VERSION}/renode-${RENODE_VERSION}.linux-portable.tar.gz"
          mkdir -p "$RUNNER_TEMP/renode"
          tar xzf renode.tar.gz -C "$RUNNER_TEMP/renode" --strip-components=1

      - name: FAT tools for SD card images
        run: sudo apt-get install -y -qq dosfstools mtools >/dev/null

      - name: Run this shard of tests/sim
        env:
          RENODE: ${{ runner.temp }}/renode/renode
          VHIL_ECU_ELF: ${{ steps.fw.outputs.ecu }}
          VHIL_AMS_ELF: ${{ steps.fw.outputs.ams }}
          VHIL_CAN_BOOTLOADER_ELF: ${{ steps.fw.outputs.bootloader }}
          SHARD: ${{ matrix.shard }}
        run: |
          # Flashing over CAN at the bus rate is minutes of emulation per
          # image, so the *bootloader* files get shards of their own:
          # ams-bootloader, and bootloader (the rest). ams: test_ams_*,
          # ecu: test_ecu_*, other: every other test file.
          bl='bootloader'
          case "$SHARD" in
            ams-bootloader) files=tests/sim/test_ams_bootloader.py ;;
            bootloader) files=$(ls tests/sim/test_*.py | grep "$bl" | grep -v '/test_ams_') ;;
            ams)   files=$(ls tests/sim/test_ams_*.py | grep -v "$bl") ;;
            ecu)   files=$(ls tests/sim/test_ecu_*.py | grep -v "$bl") ;;
            other) files=$(ls tests/sim/test_*.py | grep -v -e '/test_ams_' -e '/test_ecu_' -e "$bl") ;;
          esac
          echo "$files"
          python -m pytest $files -v --sim-log-dir sim-logs

      - name: Emulation speed on this runner
        if: always() && matrix.shard == 'ecu'
        env:
          RENODE: ${{ runner.temp }}/renode/renode
        run: |
          nproc
          python scripts/speed.py systems/ecu.yaml "ecu=${{ steps.fw.outputs.ecu }}" --mips 100 528 \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload Renode logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sim-logs-${{ matrix.shard }}
          path: sim-logs/
          if-no-files-found: ignore

  sim:
    needs: shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every shard passed
        run: test "${{ needs.shard.result }}" = success
