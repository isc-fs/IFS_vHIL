name: Smoke (virtual)

# For each system: build every board's firmware from the source the system
# declares, render the system to a Renode script, and run its smoke suite
# (tests/<system>_smoke.robot). No hardware.

# Heavy CI runs only in special cases (owner, 2026-10-06): a pull request
# labelled `full-ci`, a release pull request into main, the nightly run on
# dev, or a manual dispatch. Otherwise the jobs are skipped, which counts as
# passing for required checks; unit tests (unit.yml) run on every pull request.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: '30 2 * * *'   # nightly, on dev (see the checkout ref)
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RENODE_VERSION: 1.17.0
  # GitHub's sha256 digest for the release asset (gh release view v1.17.0 -R
  # renode/renode --json assets), checked against a download.
  RENODE_SHA256: 4ba7c68b59e2447f188ef4b4b112fcccd2802582c460beedceb63b84e5605a5f

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        system: [ecu, ams]
    env:
      # Skipped legs still report "smoke (<system>)", the required checks.
      FULL: ${{ github.event_name != 'pull_request' || github.base_ref == 'main' || contains(github.event.pull_request.labels.*.name, 'full-ci') }}
    steps:
      - name: Not a special case, skipping
        if: env.FULL != 'true'
        run: echo "smoke runs on full-ci-labelled PRs, PRs into main, nightly and dispatch"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.FULL == 'true'
        with:
          ref: ${{ github.event_name == 'schedule' && 'dev' || '' }}
          persist-credentials: false

      - name: Arm GNU toolchain (pinned like IFS_HIL's recipes)
        if: env.FULL == 'true'
        uses: carlosperate/arm-none-eabi-gcc-action@98c40e51546516419841748d3210c290df0d2c6c # v1.13.0
        with:
          release: '14.2.Rel1'

      - name: Build firmware from systems/${{ matrix.system }}.yaml
        if: env.FULL == 'true'
        id: fw
        env:
          SYSTEM: ${{ matrix.system }}
        run: |
          pip install -q pyyaml "jsonschema>=4"
          python -m vhil.system build "systems/$SYSTEM.yaml" \
            --workdir "$RUNNER_TEMP/fw" | tee built.txt
          echo "elf=$(sed -n "s/^$SYSTEM=//p" built.txt)" >> "$GITHUB_OUTPUT"
          echo "bootloader=$(sed -n "s/^$SYSTEM.bootloader=//p" built.txt)" >> "$GITHUB_OUTPUT"

      - name: Install Renode ${{ env.RENODE_VERSION }}
        if: env.FULL == 'true'
        run: |
          curl -fsSL -o renode.tar.gz \
            "https://github.com/renode/renode/releases/download/v${RENODE_VERSION}/renode-${RENODE_VERSION}.linux-portable.tar.gz"
          echo "${RENODE_SHA256}  renode.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/renode"
          tar xzf renode.tar.gz -C "$RUNNER_TEMP/renode" --strip-components=1
          pip install -q "robotframework==6.1" "robotframework-retryfailed==0.2.0" \
            "psutil==5.9.4" "pyyaml==6.0.*" "telnetlib3==2.0.*"

      - name: Run tests/${{ matrix.system }}_smoke.robot
        if: env.FULL == 'true'
        env:
          SYSTEM: ${{ matrix.system }}
          ELF: ${{ steps.fw.outputs.elf }}
          BL_ELF: ${{ steps.fw.outputs.bootloader }}
        run: |
          # With the images: the script loads the provisioned flash (the
          # bootloader in sector 0, the app behind it) that it builds.
          # --can-hub: renode-test's CAN Tester keywords attach only to
          # Renode's hub; the suite checks frames arrive, not their timing.
          python -m vhil.system render "systems/$SYSTEM.yaml" --firmware "$SYSTEM=$ELF" \
            --firmware "$SYSTEM.bootloader=$BL_ELF" --can-hub -o "$RUNNER_TEMP/system.resc"
          "$RUNNER_TEMP/renode/renode-test" "tests/${SYSTEM}_smoke.robot" \
            --variable ELF:"$ELF" \
            --variable RESC:"$RUNNER_TEMP/system.resc" -r results

      - name: Upload results
        if: always() && env.FULL == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-${{ matrix.system }}
          path: results/
          if-no-files-found: ignore
