name: Smoke (virtual)

# For each system: build every board's firmware from the source the system
# declares, render the system to a Renode script, and run its smoke suite
# (tests/<system>_smoke.robot). No hardware.

# Heavy CI runs only in special cases (owner, 2026-10-06; docs/ci.md): a
# pull request labelled `full-ci` runs the legs its changes select
# (ci/impact.yaml), `full-ci-all`, a release pull request into main, the
# nightly run on dev and a manual dispatch run both. A leg not selected
# still runs, its steps skipped, so "smoke (<system>)" (the required checks)
# always reports; unit tests (unit.yml) run on every pull request.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: '30 2 * * *'   # nightly, on dev (see the checkout ref)
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # What this event runs (scripts/ci-select.py over ci/impact.yaml).
  select:
    uses: ./.github/workflows/select.yml

  # Renode as the image builds it (docker/renode/,
  # .github/actions/setup-renode), into the Actions cache once; the legs
  # below read it from there. Only when a leg runs.
  renode:
    name: renode build
    needs: select
    if: needs.select.outputs.smoke_any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'schedule' && 'dev' || '' }}
          persist-credentials: false
      - uses: ./.github/actions/setup-renode
        with:
          save: 'true'

  smoke:
    needs: [select, renode]
    # Every leg always runs (a skipped matrix job would not report
    # "smoke (<system>)"), its steps gated on FULL: this leg's selection.
    # After the build, which a failed or skipped `renode` doesn't skip: a
    # selected leg then builds Renode itself (and fails loudly if it can't).
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        system: [ecu, ams]
    env:
      FULL: ${{ (matrix.system == 'ecu' && needs.select.outputs.smoke_ecu == 'true') || (matrix.system == 'ams' && needs.select.outputs.smoke_ams == 'true') }}
    steps:
      - name: The selection ran
        env:
          SELECT: ${{ needs.select.result }}
        # A failed selection fails the leg instead of skipping it as passed.
        run: test "$SELECT" = success

      - name: Not selected, skipping
        if: env.FULL != 'true'
        run: echo "not selected, see docs/ci.md (full-ci by impact; full-ci-all, PRs into main, nightly and dispatch run both)"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.FULL == 'true'
        with:
          ref: ${{ github.event_name == 'schedule' && 'dev' || '' }}
          persist-credentials: false

      - name: Arm GNU toolchain (pinned like IFS_HIL's recipes)
        if: env.FULL == 'true'
        uses: carlosperate/arm-none-eabi-gcc-action@0edbb000a5a98e2292b051b463bff6f512547118 # v1.14.0
        with:
          release: '14.2.Rel1'

      - name: Build firmware from systems/${{ matrix.system }}.yaml
        if: env.FULL == 'true'
        id: fw
        env:
          SYSTEM: ${{ matrix.system }}
        run: |
          pip install -q pyyaml "jsonschema>=4"
          python -m vhil.system build "systems/$SYSTEM.yaml" \
            --workdir "$RUNNER_TEMP/fw" | tee built.txt
          echo "elf=$(sed -n "s/^$SYSTEM=//p" built.txt)" >> "$GITHUB_OUTPUT"
          echo "bootloader=$(sed -n "s/^$SYSTEM.bootloader=//p" built.txt)" >> "$GITHUB_OUTPUT"

      # Renode 1.17.0 + docker/renode's patches, as the image builds it.
      - name: Renode (vHIL build)
        if: env.FULL == 'true'
        uses: ./.github/actions/setup-renode

      - name: renode-test's dependencies
        if: env.FULL == 'true'
        run: |
          pip install -q "robotframework==6.1" "robotframework-retryfailed==0.2.0" \
            "psutil==5.9.4" "pyyaml==6.0.*" "telnetlib3==2.0.*"

      - name: Run tests/${{ matrix.system }}_smoke.robot
        if: env.FULL == 'true'
        env:
          SYSTEM: ${{ matrix.system }}
          ELF: ${{ steps.fw.outputs.elf }}
          BL_ELF: ${{ steps.fw.outputs.bootloader }}
        run: |
          # With the images: the script loads the provisioned flash (the
          # bootloader in sector 0, the app behind it) that it builds.
          # --can-hub: renode-test's CAN Tester keywords attach only to
          # Renode's hub; the suite checks frames arrive, not their timing.
          python -m vhil.system render "systems/$SYSTEM.yaml" --firmware "$SYSTEM=$ELF" \
            --firmware "$SYSTEM.bootloader=$BL_ELF" --can-hub -o "$RUNNER_TEMP/system.resc"
          "$RUNNER_TEMP/renode/renode-test" "tests/${SYSTEM}_smoke.robot" \
            --variable ELF:"$ELF" \
            --variable RESC:"$RUNNER_TEMP/system.resc" -r results

      - name: Upload results
        if: always() && env.FULL == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-${{ matrix.system }}
          path: results/
          if-no-files-found: ignore
