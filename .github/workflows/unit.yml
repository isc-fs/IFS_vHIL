name: Unit (host)

# Catalogue, systems and generator checks: no Renode, no firmware build.

on:
  pull_request:
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: pip install -q pyyaml "ruamel.yaml==0.18.*" "jsonschema>=4" pytest "fastapi==0.115.*" "httpx==0.28.*" "cryptography==50.0.*"
      - run: python -m pytest tests/unit -q
      - name: Every system validates
        run: for s in systems/*.yaml; do python -m vhil.system validate "$s"; done
