name: Unit (host)

# Catalogue, systems and generator checks: no Renode, no firmware build.

on:
  pull_request:
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - run: pip install -q pyyaml "ruamel.yaml==0.18.*" "jsonschema>=4" pytest "fastapi==0.115.*" "httpx==0.28.*" "cryptography==50.0.*"
      - run: python -m pytest tests/unit -q
      - name: Every system validates
        run: for s in systems/*.yaml; do python -m vhil.system validate "$s"; done

  pin-model:
    # Warns, never fails, when the MainLite publishes a newer pin model than
    # catalog/pin-models/ vendors (scripts/update-pin-model.sh <tag>).
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Newer pin model release?
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/update-pin-model.sh --check
