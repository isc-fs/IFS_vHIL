name: ECU smoke (virtual)

# Builds the ECU exactly as IFS_HIL's configs/firmware/ecu.yaml does, boots it
# on the virtual STM32H733 and runs tests/ecu_smoke.robot. No hardware.

on:
  pull_request:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      ecu_ref:
        description: "IFS08-CE-ECU ref to test"
        required: false
        default: dev

env:
  RENODE_VERSION: 1.17.0

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check out the ECU firmware
        uses: actions/checkout@v4
        with:
          repository: isc-fs/IFS08-CE-ECU
          ref: ${{ inputs.ecu_ref || 'dev' }}
          path: fw/ecu

      - name: Arm GNU toolchain (pinned like IFS_HIL's recipe)
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '14.2.Rel1'

      - name: Build ECU08.elf
        run: scripts/build_fw.sh fw/ecu

      - name: Install Renode ${{ env.RENODE_VERSION }}
        run: |
          curl -sSL -o renode.tar.gz \
            "https://github.com/renode/renode/releases/download/v${RENODE_VERSION}/renode-${RENODE_VERSION}.linux-portable.tar.gz"
          mkdir -p "$RUNNER_TEMP/renode"
          tar xzf renode.tar.gz -C "$RUNNER_TEMP/renode" --strip-components=1
          pip install -q "robotframework==6.1" "robotframework-retryfailed==0.2.0" \
            "psutil==5.9.4" "pyyaml==6.0.*" "telnetlib3==2.0.*"

      - name: Run tests/ecu_smoke.robot
        run: |
          "$RUNNER_TEMP/renode/renode-test" tests/ecu_smoke.robot \
            --variable ELF:"$GITHUB_WORKSPACE/fw/ecu/build/ECU08.elf" -r results

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ecu-smoke-results
          path: results/
          if-no-files-found: ignore
