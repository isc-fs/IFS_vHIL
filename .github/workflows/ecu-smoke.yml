name: ECU smoke (virtual)

# Builds the ECU from the source systems/ecu.yaml declares (IFS_HIL's recipe),
# renders the system to a Renode script, and runs tests/ecu_smoke.robot on it.

on:
  pull_request:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      ecu_ref:
        description: "ECU firmware ref (default: the ref in catalog/firmware/ecu.yaml)"
        required: false

env:
  RENODE_VERSION: 1.17.0

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Arm GNU toolchain (pinned like IFS_HIL's recipe)
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '14.2.Rel1'

      - name: Build the ECU firmware from systems/ecu.yaml
        id: fw
        env:
          ECU_REF: ${{ inputs.ecu_ref }}
        run: |
          pip install -q pyyaml "jsonschema>=4"
          python -m vhil.system build systems/ecu.yaml --workdir "$RUNNER_TEMP/fw" \
            ${ECU_REF:+--ref "ecu=$ECU_REF"} | tee built.txt
          echo "elf=$(sed -n 's/^ecu=//p' built.txt)" >> "$GITHUB_OUTPUT"

      - name: Install Renode ${{ env.RENODE_VERSION }}
        run: |
          curl -sSL -o renode.tar.gz \
            "https://github.com/renode/renode/releases/download/v${RENODE_VERSION}/renode-${RENODE_VERSION}.linux-portable.tar.gz"
          mkdir -p "$RUNNER_TEMP/renode"
          tar xzf renode.tar.gz -C "$RUNNER_TEMP/renode" --strip-components=1
          pip install -q "robotframework==6.1" "robotframework-retryfailed==0.2.0" \
            "psutil==5.9.4" "pyyaml==6.0.*" "telnetlib3==2.0.*"

      - name: Run tests/ecu_smoke.robot
        run: |
          python -m vhil.system render systems/ecu.yaml -o "$RUNNER_TEMP/ecu.resc"
          "$RUNNER_TEMP/renode/renode-test" tests/ecu_smoke.robot \
            --variable ELF:"${{ steps.fw.outputs.elf }}" \
            --variable RESC:"$RUNNER_TEMP/ecu.resc" -r results

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ecu-smoke-results
          path: results/
          if-no-files-found: ignore
