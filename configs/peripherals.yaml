# Unmodelled hardware the firmware is allowed to touch, and why that is safe.
#
# Renode drops writes to, and returns 0 for reads from, registers it does not
# model. vhil/peripheral_guard.py fails a run when firmware touches anything
# not listed here. Add an entry only with a reason the access cannot change
# what a test observes. Otherwise, model the hardware.
# A gap that is tracked but not yet modelled may be listed with "KNOWN GAP
# #<issue>" in its reason, so a run stays honest about it without failing; the
# entry goes when the issue closes.
#
#   peripheral: <name or glob>   offsets: [<register offsets>]  (omit = any)
#   tag: <tagged sysbus region>
#   address: <unmapped address>
#   machine: <board instance>  (optional; omit = any board)

- peripheral: usb1
  why: "USB OTG HS: CubeMX initialises it (MX_USB_OTG_HS_PCD_Init), but neither app ever uses USB"

- tag: CAN_CCU
  why: "FDCAN clock-calibration unit. HAL_FDCAN_IRQHandler polls its IR/IE on FDCAN1; calibration is off (classic CAN, HSE kernel clock), so reading 0 is the hardware's answer too"

- peripheral: fdcan1*
  offsets: [0x108]
  why: "TT-CAN TTOCF. HAL_FDCAN_Init clears its OM bits on FDCAN1 (stm32h7xx_hal_fdcan.c:583) and HAL reads it to test for TT mode; reading 0 means event-driven, which is the firmware's real configuration"

- peripheral: rcc
  offsets: [0x2C, 0x54, 0xEC, 0xF0]
  why: "PLLCFGR fractional/range bits (0x2C), D2CCIP2R USBSEL (0x54), and the H72x/H73x-only enable bits the H743 RCC model treats as reserved: APB1HENR.TIM23EN bit 24 (0xEC) and APB2ENR.USART10EN bit 7 (0xF0), per stm32h733xx.h. Renode does not gate clocks, so those peripherals run regardless; frequencies come from the PLL dividers, which are modelled"

- peripheral: rcc
  offsets: [0xD0, 0x130]
  why: "RCC_RSR and its RCC_C1_RSR mirror are owned by models/renode/VhilResetFlags.cs through bus hooks: reads return its flags and an RMVF write clears them there. The RCC model's own field underneath is shadowed, so its unhandled-bit warning is moot"

- peripheral: usart10
  offsets: [0x08, 0x2C]
  why: "CR3.EIE (error interrupt) and PRESC, which the F7-family USART model lacks. Baud rate is not modelled, so the prescaler cannot change what a test sees"

# The AMS's accesses, visible since the guard reads machine-prefixed lines.

- peripheral: spi1
  offsets: [0x0, 0x8, 0xC, 0x18]
  why: "SPI1 to the LTC6820: CR1.SSI, CFG1.MBR (baud divider), CFG2.MSSI/SSM/SSOM (hardware NSS) and CFG2.COMM (TX-only during writes), IFCR.TXTFC. Renode does not model SPI clocking or hardware NSS, and the LTC chip select is a GPIO (PB9). COMM would only matter if the model kept bytes the TX-only hardware would not receive; the chain reads back with zero PEC errors, so it does not"

- peripheral: gpioPortF
  offsets: [0x4]
  why: "OTYPER OT0/OT1: open-drain on PF0/PF1 (I2C2). No electrical model; the BMI088 behind them is #59"

- peripheral: usart*
  offsets: [0x2C]
  why: "PRESC, which the F7-family USART model lacks (as for usart10). Baud rate is not modelled, so the prescaler cannot change what a test sees"

- peripheral: sdmmc1
  offsets: [0x2C]
  why: "DCTRL.DTEN, which Renode's SDMMC base defines as a tag. The H7 HAL starts the data path with CMD.CMDTRANS, which the model handles; DTEN does not change what moves"

- peripheral: i2c2
  offsets: [0x4, 0x10]
  why: "KNOWN GAP #59: CR2.NACK and TIMINGR (bus timing, not modelled). The bits themselves are harmless; the BMI088 behind them is not modelled, so the AMS's ImuTask times out"

- peripheral: dma1
  offsets: [0x8, 0x24]
  why: "KNOWN GAP #59: DMA1 Stream0 (I2C2 RX for the BMI088) flag clears in LIFCR and SxFCR.FS. Harmless as bits; the transfer they serve is the missing IMU"

# The CAN bootloader's accesses (boards with a bootloader, e.g. ecu-bl.yaml).

- peripheral: flashController
  offsets: [0xC]
  why: "CR1.PSIZE1, the programming parallelism (x8..x64). It sets how fast a flash word programs, not what is written, and the model programs instantly"

- peripheral: flashController
  offsets: [0x14]
  why: "CCR1 clears of WRPERR/STRBERR/RDPERR/RDSERR. The model never sets those errors, so clearing them changes nothing"

- peripheral: flashController
  offsets: [0x28, 0x30, 0x40, 0x70]
  why: "KNOWN GAP #67: option-byte status (PRAR_CUR1 write-protection area, SCAR_CUR1 secure area, BOOT_CURR) and the ECC fail address read 0: no protection, no ECC error. The bootloader's WRP latch can't be exercised until modelled"

- peripheral: rcc
  offsets: [0x7C, 0x84, 0x90, 0x94, 0x98, 0x9C]
  why: "KNOWN GAP #68: the bootloader's HAL_DeInit peripheral resets (xxxRSTR), H73x-only bits the H743 RCC model treats as reserved. Renode doesn't reset peripherals from these registers; the app reinitialises what it uses"
