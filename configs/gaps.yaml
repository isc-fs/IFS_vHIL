# IFS_HIL tests the virtual bench cannot pass yet, and why: the parity
# ledger. The vhil plugin skips them with this reason, so they show in every
# report. A test leaves this list when the virtual bench can run it, never to
# make a run green.
#
# path:    IFS_HIL test file, or file::test-function (prefix match; the class
#          name is not part of it, a parameter id is)
# why:     the model gap with the vHIL issue that tracks it; or the IFS_HIL /
#          firmware issue when the test and the firmware disagree; or
#          "physical-only" and why only real hardware can answer it
# systems: (optional) the system ids it applies to; default every system
# replaced_by: (optional) the native tests (tests/sim/<file>::<test>[<param
#          id>]) that cover the case's firmware behaviour instead, when the
#          vHIL won't run the IFS_HIL case itself (its bench stimulus is not
#          modelled, by decision). tests/unit/test_system.py checks each exists.
#
# Last full runs (IFS_HIL dev fa11a25; AMS main df1c961, ECU dev 544b651),
# AMS `full` on systems/ams.yaml and ECU `full` on systems/ecu.yaml; the
# catalogue's AMS has since moved to dev (#208), where the AMS notes below
# were re-checked. The tail
# of this file lists what IFS_HIL itself skips or deselects; those are not
# gaps.

