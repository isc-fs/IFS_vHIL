#
# -- Hardware recorded as a gap, not modelled (docs/backplanes/ecu.md) ----------
# No IFS_HIL test depends on these today; each is a bare MCU pin in the
# emulator (wired by #148), with nothing behind it:
#   ECU PB6, the DC-link discharge coil-interrupt: no driver on any schematic,
#     header J3.18 only (IFS08-CE-ECU#253). M8 (#147) keeps it out of scope.
#   ECU PB4, RTDS: unbuffered bare pin to J1.20 (IFS08-CE-ECU#254); the bench
#     ADC readback (adc_routes) sees the logic level only, as bench-01 does.
#   ECU PD5, S_TEMP_REFRI (1-Wire, J1.15): no firmware drives it, no sensor model.
#   ECU PB9 / PC1 and the other spare header pins: unconnected on the backplane.
