# The shared web app (M5, #13; docs/architecture/m5-web-app.md), local/dev:
#
#   docker compose -f docker/compose.yaml up        # then http://localhost:8080
#
# (`scripts/vhil-docker.sh server` and `editor` start parts of it.) Images
# come from `scripts/vhil-docker.sh image` (ifs-vhil, ifs-vhil-editor). The
# repository checkout is the workspace: its systems/ and catalog/ are what
# the app shows and edits; `worker` executes the runs the api queues.
#
# One origin, as on a host: `proxy` (Caddy, the same deploy/Caddyfile)
# publishes the app on 127.0.0.1:8080 and the editor under /editor/ behind
# the API's login check; the api and the editor publish no port of their own.
# VHIL_AUTH=dev: no login, the default here (unset in the server means
# github: it fails closed). The server refuses dev mode off loopback; the api
# listens on 0.0.0.0 inside its container, reachable only through the proxy,
# whose port is on the host's 127.0.0.1 only, and VHIL_ALLOW_DEV_ON_NETWORK=1
# says so. For GitHub login set VHIL_AUTH=github and the VHIL_GITHUB_* /
# VHIL_SESSION_SECRET variables (docs/development/web-app.md), e.g. from an
# env file kept out of git.
name: ifs-vhil
services:
  api:
    image: ${VHIL_IMAGE:-ifs-vhil}
    command: python -m vhil.server --host 0.0.0.0 --port 8080
    working_dir: /work
    volumes:
      - ..:/work
      - vhil-data:/vhil
    environment:
      VHIL_WORKSPACE: /work
      VHIL_DATA: /vhil/server
      VHIL_AUTH: ${VHIL_AUTH:-dev}
      # Read only with VHIL_AUTH=dev: the api is reached through the proxy,
      # whose port is on 127.0.0.1 only.
      VHIL_ALLOW_DEV_ON_NETWORK: "1"
      VHIL_GITHUB_ORG: ${VHIL_GITHUB_ORG:-isc-fs}
      VHIL_GITHUB_CLIENT_ID: ${VHIL_GITHUB_CLIENT_ID:-}
      VHIL_GITHUB_CLIENT_SECRET: ${VHIL_GITHUB_CLIENT_SECRET:-}
      VHIL_SESSION_SECRET: ${VHIL_SESSION_SECRET:-}
      VHIL_PUBLIC_URL: ${VHIL_PUBLIC_URL:-}
      VHIL_GITHUB_APP_ID: ${VHIL_GITHUB_APP_ID:-}
      VHIL_GITHUB_APP_KEY: ${VHIL_GITHUB_APP_KEY:-}
      VHIL_ADMINS: ${VHIL_ADMINS:-}
      # Pushing saved system branches and opening PRs (until the GitHub App).
      VHIL_GITHUB_TOKEN: ${VHIL_GITHUB_TOKEN:-}
      # Saves commit to the mounted checkout's refs (never its tree); it is
      # owned by the host user, not the container's.
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: /work
  worker:
    # Claims queued runs (vhil/worker.py); scale with --scale worker=N.
    # Shares the run table and results with the api through the vhil-data
    # volume, and reuses (or builds into) /vhil/fw like
    # `scripts/vhil-docker.sh fw`. Unprivileged, on the default network:
    # run scenarios and tests/sim use Renode's in-process CAN hubs, not vcan
    # (the IFS_HIL suites over vcan are `scripts/vhil-docker.sh ifs-hil`).
    image: ${VHIL_IMAGE:-ifs-vhil}
    command: python -m vhil.worker
    working_dir: /work
    volumes:
      - ..:/work
      - vhil-data:/vhil
    environment:
      VHIL_WORKSPACE: /work
      VHIL_DATA: /vhil/server
      VHIL_AUTH: dev
      VHIL_FW_DIR: /vhil/fw
  editor:
    image: ${VHIL_IMAGE:-ifs-vhil}-editor
    command: scripts/editor.sh
    working_dir: /work
    volumes:
      - ..:/work
      - vhil-data:/vhil
    environment:
      PM_HOST: 0.0.0.0
      EDITOR_URL: http://localhost:${VHIL_WEB_PORT:-8080}/editor/
  proxy:
    image: caddy:2.11.6-alpine@sha256:c776e0c6413b544d0459665e54ec7b8b2a15000c0cbee8b254da0067b1d184ff
    depends_on: [api]
    volumes:
      - ../deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    environment:
      VHIL_SITE: http://:8080
    ports:
      # Loopback only: dev auth lets anyone who reaches it in.
      - "127.0.0.1:${VHIL_WEB_PORT:-8080}:8080"
volumes:
  vhil-data:
    external: true
