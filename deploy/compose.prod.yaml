# The shared web app on a host (M5.6, #118; docs/deploy.md).
#
#   cp deploy/.env.example deploy/.env      # then fill it in
#   (secret files in deploy/secrets/, docs/deploy.md "First-time setup")
#   docker compose -f deploy/compose.prod.yaml up -d
#
# Services:
#   volume-owner one-shot: gives the volumes to the unprivileged user (10001)
#   workspace  one-shot: clone/fetch the app's own IFS_vHIL clone, check out
#              VHIL_WORKSPACE_REF (deploy/workspace.sh); the rest wait for it
#   egress     the workers' only way out: CONNECT to an allowlist (GitHub)
#   api        FastAPI (vhil.server): shell, systems, runs, auth
#   worker     vhil.worker x VHIL_WORKERS: claims queued runs, runs Renode
#   editor     Pipeline Manager + vhil.editor (the shell embeds it)
#   proxy      Caddy: TLS for VHIL_SITE (the app) and VHIL_EDITOR_SITE (the editor)
#   backup     SQLite + saved-branch snapshots (deploy/backup.py)
#
# The code, catalogue and systems every service runs come from the workspace
# clone (the images carry only the toolchain, like CI's runners), so the
# deployed version is VHIL_WORKSPACE_REF; this checkout only supplies this
# file, the Caddyfile and the scripts below.
#
# Hardening (docs/deploy.md, "Hardening"): every service runs as uid 10001
# with no capabilities, no-new-privileges, a read-only root filesystem (tmpfs
# for /tmp), a pids limit and CPU/memory limits, and mounts only what it
# needs. Networks: `frontend` (proxy, api), `editor` (proxy, editor;
# internal), `jobs` (workers, workspace, egress; internal: no route off the
# host but through `egress`), `egress` (egress only). Secrets are files
# (compose `secrets:`, read through *_FILE variables), never environment
# values; the workers get none.
name: ifs-vhil-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-hardened: &hardened
  user: "10001:10001"
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  init: true
  logging: *logging

x-vhil: &vhil
  <<: *hardened
  image: ${VHIL_IMAGE:-ghcr.io/isc-fs/ifs-vhil}:${VHIL_TAG:-latest}${VHIL_DIGEST:-}
  restart: unless-stopped
  working_dir: /workspace
  depends_on:
    workspace:
      condition: service_completed_successfully

x-paths: &paths
  VHIL_WORKSPACE: /workspace
  VHIL_DB: /data/db/vhil.db
  VHIL_RESULTS: /data/runs
  VHIL_FW_DIR: /vhil/fw
  HOME: /tmp

# git (firmware clones, the workspace fetch) goes out through `egress`.
x-proxied: &proxied
  https_proxy: http://egress:3128
  HTTPS_PROXY: http://egress:3128
  http_proxy: http://egress:3128
  HTTP_PROXY: http://egress:3128
  no_proxy: localhost,127.0.0.1,::1
  NO_PROXY: localhost,127.0.0.1,::1

services:
  volume-owner:
    # Docker seeds a new volume with the image directory's owner (10001); a
    # volume from before the services ran unprivileged is root's. This chowns
    # whatever isn't 10001's yet (a no-op after the first run): root, but
    # with CHOWN (and DAC_READ_SEARCH to walk the trees) only, and no network.
    image: ${VHIL_IMAGE:-ghcr.io/isc-fs/ifs-vhil}:${VHIL_TAG:-latest}${VHIL_DIGEST:-}
    user: "0:0"
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_READ_SEARCH]
    security_opt: ["no-new-privileges:true"]
    network_mode: none
    restart: "no"
    logging: *logging
    pids_limit: 64
    command:
      - bash
      - -c
      - |
        for d in /workspace /data/db /data/runs /vhil/fw /backups /caddy/data /caddy/config; do
            find "$$d" -xdev \( ! -user 10001 -o ! -group 10001 \) -exec chown -h 10001:10001 {} +
        done
    volumes:
      - workspace:/workspace
      - db:/data/db
      - runs:/data/runs
      - fw:/vhil/fw
      - ${VHIL_BACKUP_DIR:-backups}:/backups
      - caddy-data:/caddy/data
      - caddy-config:/caddy/config
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256m

  egress:
    <<: *hardened
    image: ${VHIL_IMAGE:-ghcr.io/isc-fs/ifs-vhil}:${VHIL_TAG:-latest}${VHIL_DIGEST:-}
    command: python /deploy/egress_proxy.py
    restart: unless-stopped
    networks: [jobs, egress]
    volumes:
      - ./egress_proxy.py:/deploy/egress_proxy.py:ro
    environment:
      VHIL_EGRESS_ALLOW: ${VHIL_EGRESS_ALLOW:-github.com,.githubusercontent.com}
      VHIL_EGRESS_PORTS: ${VHIL_EGRESS_PORTS:-443}
    healthcheck:
      test: ["CMD", "python", "-c",
             "import socket; socket.create_connection(('127.0.0.1', 3128), 5).close()"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      start_interval: 2s
      retries: 3
    pids_limit: 64
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128m

  workspace:
    <<: *hardened
    image: ${VHIL_IMAGE:-ghcr.io/isc-fs/ifs-vhil}:${VHIL_TAG:-latest}${VHIL_DIGEST:-}
    command: bash /deploy/workspace.sh
    restart: "no"
    depends_on:
      volume-owner:
        condition: service_completed_successfully
      egress:
        condition: service_healthy
    networks: [jobs]
    tmpfs:
      - /tmp:size=256m,mode=1777
    volumes:
      - workspace:/workspace
      - ./workspace.sh:/deploy/workspace.sh:ro
    secrets:
      - github_token
    environment:
      <<: *proxied
      HOME: /tmp
      VHIL_WORKSPACE: /workspace
      VHIL_WORKSPACE_REMOTE: ${VHIL_WORKSPACE_REMOTE:-https://github.com/isc-fs/IFS_vHIL.git}
      # A tag or a commit, not a branch: what runs changes only on purpose.
      VHIL_WORKSPACE_REF: ${VHIL_WORKSPACE_REF:?set VHIL_WORKSPACE_REF (a tag or commit) in deploy/.env}
      VHIL_GITHUB_TOKEN_FILE: /run/secrets/github_token
    pids_limit: 256
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1g

  api:
    <<: *vhil
    command: python -m vhil.server --host 0.0.0.0 --port 8080
    networks: [frontend]
    tmpfs:
      - /tmp:size=256m,mode=1777
    volumes:
      - workspace:/workspace           # saves commit branches here
      - db:/data/db
      - runs:/data/runs:ro             # traces and artifacts: read only
      - fw:/vhil/fw:ro                 # the inspect view's CAN contract (.def files)
    secrets:
      - session_secret
      - github_client_secret
      - github_app_key
      - github_token
    environment:
      <<: *paths
      VHIL_AUTH: ${VHIL_AUTH:-github}
      VHIL_PUBLIC_URL: ${VHIL_PUBLIC_URL:?set VHIL_PUBLIC_URL in deploy/.env}
      VHIL_EDITOR_URL: ${VHIL_EDITOR_URL:?set VHIL_EDITOR_URL in deploy/.env}
      VHIL_GITHUB_ORG: ${VHIL_GITHUB_ORG:-isc-fs}
      VHIL_GITHUB_CLIENT_ID: ${VHIL_GITHUB_CLIENT_ID:-}
      VHIL_GITHUB_CLIENT_SECRET_FILE: /run/secrets/github_client_secret
      VHIL_SESSION_SECRET_FILE: /run/secrets/session_secret
      VHIL_GITHUB_APP_ID: ${VHIL_GITHUB_APP_ID:-}
      VHIL_GITHUB_APP_KEY_FILE: /run/secrets/github_app_key
      VHIL_GITHUB_TOKEN_FILE: /run/secrets/github_token
      VHIL_GITHUB_REPO: ${VHIL_GITHUB_REPO:-isc-fs/IFS_vHIL}
      VHIL_BASE_BRANCH: ${VHIL_BASE_BRANCH:-dev}
      # Limits (vhil/server/runs.py Limits; docs/deploy.md, "Limits").
      VHIL_MAX_VIRTUAL_MS: ${VHIL_MAX_VIRTUAL_MS:-600000}
      VHIL_MAX_QUEUED: ${VHIL_MAX_QUEUED:-50}
      VHIL_MAX_QUEUED_PER_USER: ${VHIL_MAX_QUEUED_PER_USER:-10}
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request as u; u.urlopen('http://127.0.0.1:8080/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      start_interval: 5s
      retries: 3
    pids_limit: 256
    deploy:
      resources:
        limits:
          cpus: "${VHIL_API_CPUS:-2}"
          memory: ${VHIL_API_MEMORY:-2g}

  worker:
    <<: *vhil
    # A run's Renode needs no privileges and no host network: the run
    # scenarios and tests/sim use Renode's in-process CAN hubs, not vcan.
    # Each replica has its own network namespace, so concurrent runs can't
    # collide on monitor ports or CAN links. If a scenario ever bridges to
    # SocketCAN (--vhil-socketcan, IFS_HIL suites), add `cap_add: [NET_ADMIN]`
    # (create vcan links inside the replica's own namespace; the host must
    # have the vcan module loaded, docs/deploy.md) rather than privileged.
    #
    # It builds firmware and runs it: the least trusted service. No secrets,
    # the code read only, and the internal `jobs` network: GitHub through
    # `egress`, nothing else (not the API, the editor or the metadata service).
    command: python -m vhil.worker
    depends_on:
      workspace:
        condition: service_completed_successfully
      egress:
        condition: service_healthy
    networks: [jobs]
    tmpfs:
      # Renode compiles its C# models here; pytest's tmp_path; counts
      # against the memory limit.
      - /tmp:size=${VHIL_WORKER_TMP:-1g},mode=1777
    volumes:
      - workspace:/workspace:ro
      - db:/data/db                    # claims, heartbeats, results: see docs/deploy.md
      - runs:/data/runs
      - fw:/vhil/fw
    environment:
      <<: [*paths, *proxied]
      VHIL_MAX_TRACE_MB: ${VHIL_MAX_TRACE_MB:-512}
      VHIL_MAX_OUTPUT_MB: ${VHIL_MAX_OUTPUT_MB:-64}
    # docker stop: SIGTERM ends the current run as error (vhil/worker.py).
    stop_grace_period: 30s
    # No healthcheck: it serves nothing. A crash exits and restarts it.
    pids_limit: ${VHIL_WORKER_PIDS:-2048}
    deploy:
      replicas: ${VHIL_WORKERS:-2}
      resources:
        limits:
          cpus: "${VHIL_WORKER_CPUS:-4}"
          memory: ${VHIL_WORKER_MEMORY:-4g}

  editor:
    <<: *vhil
    image: ${VHIL_IMAGE:-ghcr.io/isc-fs/ifs-vhil}-editor:${VHIL_TAG:-latest}${VHIL_EDITOR_DIGEST:-}
    command: scripts/editor.sh
    # Internal network shared with the proxy only: reachable through the
    # proxy's auth gate and nowhere else, and no way out.
    networks: [editor]
    tmpfs:
      - /tmp:size=512m,mode=1777
    volumes:
      - workspace:/workspace:ro
    environment:
      HOME: /tmp
      PM_HOST: 0.0.0.0
      LOG_DIR: /tmp/editor
      EDITOR_URL: ${VHIL_EDITOR_URL}
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request as u; u.urlopen('http://127.0.0.1:5000/', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      start_interval: 5s
      retries: 3
    pids_limit: 512
    deploy:
      resources:
        limits:
          cpus: "${VHIL_EDITOR_CPUS:-1}"
          memory: ${VHIL_EDITOR_MEMORY:-2g}

  proxy:
    <<: *hardened
    image: caddy:2.11.6-alpine@sha256:c776e0c6413b544d0459665e54ec7b8b2a15000c0cbee8b254da0067b1d184ff
    restart: unless-stopped
    depends_on:
      volume-owner:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    networks: [frontend, editor]
    # Binding 80/443 as uid 10001 with no capabilities works because Docker
    # sets net.ipv4.ip_unprivileged_port_start=0 in a container's namespace.
    # The image's /usr/bin/caddy carries a file capability (setcap
    # cap_net_bind_service), which the kernel refuses to exec under
    # no-new-privileges with every capability dropped ("operation not
    # permitted"); a plain copy of it (no xattrs) runs, and needs none.
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    command: ["sh", "-c", "cp /usr/bin/caddy /tmp/caddy && exec /tmp/caddy run --config /etc/caddy/Caddyfile --adapter caddyfile"]
    ports:
      - "${VHIL_BIND_ADDR:-0.0.0.0}:${VHIL_HTTP_PORT:-80}:80"
      - "${VHIL_BIND_ADDR:-0.0.0.0}:${VHIL_HTTPS_PORT:-443}:443"
      - "${VHIL_BIND_ADDR:-0.0.0.0}:${VHIL_HTTPS_PORT:-443}:443/udp"
      - "${VHIL_BIND_ADDR:-0.0.0.0}:${VHIL_EDITOR_PORT:-5443}:5443"
    tmpfs:
      - /tmp:exec,size=128m,mode=1777     # exec: the caddy copy above
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      VHIL_SITE: ${VHIL_SITE:?set VHIL_SITE in deploy/.env}
      VHIL_EDITOR_SITE: ${VHIL_EDITOR_SITE:?set VHIL_EDITOR_SITE in deploy/.env}
      VHIL_PUBLIC_URL: ${VHIL_PUBLIC_URL:?set VHIL_PUBLIC_URL in deploy/.env}
      VHIL_HSTS_MAX_AGE: ${VHIL_HSTS_MAX_AGE:-31536000}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      start_interval: 2s
      retries: 3
    pids_limit: 256
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256m

  backup:
    <<: *hardened
    image: ${VHIL_IMAGE:-ghcr.io/isc-fs/ifs-vhil}:${VHIL_TAG:-latest}${VHIL_DIGEST:-}
    command: python /deploy/backup.py loop
    restart: unless-stopped
    depends_on:
      workspace:
        condition: service_completed_successfully
    network_mode: none
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - ./backup.py:/deploy/backup.py:ro
      - db:/data/db
      - workspace:/workspace:ro
      - ${VHIL_BACKUP_DIR:-backups}:/backups
    environment:
      HOME: /tmp
      VHIL_DB: /data/db/vhil.db
      VHIL_WORKSPACE: /workspace
      VHIL_BACKUP_DIR: /backups
      VHIL_BACKUP_KEEP: ${VHIL_BACKUP_KEEP:-14}
      VHIL_BACKUP_INTERVAL_H: ${VHIL_BACKUP_INTERVAL_H:-24}
    pids_limit: 64
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m

networks:
  frontend:      # proxy <-> api; the api's own way out (GitHub login, pushes)
  editor:        # proxy <-> editor only
    internal: true
  jobs:          # workers + workspace + egress: no route off the host
    internal: true
  egress:        # egress's way out

secrets:
  # Files in VHIL_SECRETS_DIR (default deploy/secrets/), owned by uid 10001,
  # mode 0400 (docs/deploy.md). An unused one is an empty file.
  session_secret:
    file: ${VHIL_SECRETS_DIR:-./secrets}/session_secret
  github_client_secret:
    file: ${VHIL_SECRETS_DIR:-./secrets}/github_client_secret
  github_app_key:
    file: ${VHIL_SECRETS_DIR:-./secrets}/${VHIL_GITHUB_APP_KEY_FILE:-github-app.pem}
  github_token:
    file: ${VHIL_SECRETS_DIR:-./secrets}/github_token

volumes:
  workspace:   # the app's IFS_vHIL clone; local branches = saved systems
  db:          # vhil.db (WAL): run queue + history
  runs:        # per-run traces and artifacts
  fw:          # firmware sources and builds (vhil.system build), built.txt
  backups:     # snapshots, unless VHIL_BACKUP_DIR names a host directory
  caddy-data:  # TLS certificates and the ACME account: keep across upgrades
  caddy-config:
