kind: system
id: ecu-ams-ecu
description: >-
  BENCHMARK ONLY, not a car system (scripts/speed.py --systems ecu-ams-ecu):
  ecu-ams plus a third MainLite, so the cost of a three-board system was
  measured before the uDV (role udv) had a firmware (systems/ecu-ams-udv.yaml
  is the car's three-board system now). The third board runs the
  ECU application in role ecu on buses of its own (two ECUs on one bus would
  share node and frame IDs), with its own nRF24, as ecu.yaml's ECU does.
time:
  quantum_s: 0.0005
boards:
  ecu: {board: mainlite, role: ecu}
  ams: {board: mainlite, role: ams}
  ecu2: {board: mainlite, role: ecu}
buses:
  # ecu and ams as in ecu-ams.yaml.
  can_inv:  {kind: can, nodes: [ecu.FDCAN1], host_netdev: can0}  # CAN_H/L_INV, J1.9/J1.10 (docs/backplanes/ecu.md)
  can_dash: {kind: can, nodes: [ecu.FDCAN3], host_netdev: can1}  # net CAN_H/L_SENS (stale name), J1.13/J1.14 (docs/backplanes/ecu.md)
  can_acu:  {kind: can, nodes: [ecu.FDCAN2, ams.FDCAN1], host_netdev: can2}  # ECU J1.11/J1.12, AMS J1.9/J1.10 (docs/backplanes/ecu.md, ams.md)
  # ecu2's, as ecu.yaml's ECU has them.
  can2_inv:  {kind: can, nodes: [ecu2.FDCAN1], host_netdev: can3}  # CAN_H/L_INV, J1.9/J1.10 (docs/backplanes/ecu.md)
  can2_dash: {kind: can, nodes: [ecu2.FDCAN3], host_netdev: can4}  # net CAN_H/L_SENS (stale name), J1.13/J1.14 (docs/backplanes/ecu.md)
  can2_acu:  {kind: can, nodes: [ecu2.FDCAN2], host_netdev: can5}  # net CAN_H/L_TEL (stale name), J1.11/J1.12 (docs/backplanes/ecu.md)
devices:
  # As in ecu-ams.yaml.
  radio: {model: nrf24l01p, pins: {csn: ecu.PB0, sck: ecu.PA5, mosi: ecu.PA7, miso: ecu.PA6, ce: ecu.PC5, irq: ecu.PC4}}  # NRF24_CS/SCK/MOSI/MISO/CE/IRQ, on board (docs/backplanes/ecu.md)
  isospi: {model: ltc6820, spi: ams.SPI1, cs: ams.PB9}  # SPI1 + LTC6820_CS -> U4 LTC6820 (docs/backplanes/ams.md)
  cells: {model: ltc6811, attach: isospi, count: 10}
  sd: {model: sd-card, sdmmc: ams.SDMMC1}
  imu: {model: bmi088, i2c: ams.I2C2}
  pack_current: {model: ssa-2-250a, outputs: {out_p: ams.PF7, out_n: ams.PF8}}  # S_CURRENT_P/N -> J4.3/J4.2 (docs/backplanes/ams.md)
  dcdc_current: {model: acs758lcb-050b, outputs: {out: ams.PC1}}  # S_CURRENT_DCDC -> J3.5 (docs/backplanes/ams.md)
  # ecu2's radio.
  radio2: {model: nrf24l01p, pins: {csn: ecu2.PB0, sck: ecu2.PA5, mosi: ecu2.PA7, miso: ecu2.PA6, ce: ecu2.PC5, irq: ecu2.PC4}}  # on board (docs/backplanes/ecu.md)
bench:
  power:
    - {board: ecu, slot: 4, relay: {addr: 0x20, port: 0, pin: 3}, ina_addr: 0x45, current_A: 0.13}
    - {board: ams, slot: 2, relay: {addr: 0x20, port: 0, pin: 1}, ina_addr: 0x41, current_A: 0.12}
    - {board: ecu2, slot: 3, relay: {addr: 0x20, port: 0, pin: 2}, ina_addr: 0x44, current_A: 0.13}
