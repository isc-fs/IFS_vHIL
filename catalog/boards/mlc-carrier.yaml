kind: board
id: mlc-carrier
description: >-
  MLC carrier: the STM32H733ZG daughter-board in every BACKPLANE_HIL slot.
  Connector and pin names follow the MCU (FDCANn, port pins); what a
  firmware uses them for belongs to the system, not the board.
platform: stm32h733
can:
  FDCAN1: sysbus.fdcan1
  FDCAN2: sysbus.fdcan2
  FDCAN3: sysbus.fdcan3
spi:
  SPI1: sysbus.spi1
sdmmc:
  SDMMC1: sysbus.sdmmc
gpio:
  # Software chip-select of SPI1 on the AMS (main.h: LTC_CS, PB9).
  PB9: {port: sysbus.gpioPortB, pin: 9}
analog_in:
  # ADC3 inputs routed to the carrier connector (IFS_HIL vcu_profile.yaml).
  PF7: {adc: sysbus.adc3_h73x, channel: 3}
  PF8: {adc: sysbus.adc3_h73x, channel: 7}
  PF9: {adc: sysbus.adc3_h73x, channel: 2}
  # AMS DCDC current sensor, single-ended (ams_config.hpp:710).
  PC1: {adc: sysbus.adc3_h73x, channel: 11}
