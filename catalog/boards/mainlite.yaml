kind: board
id: mainlite
description: >-
  MainLite: the minimal STM32H733ZG unit. Mounted on a backplane it becomes
  the AMS, the ECU or the uDV.
  Connector and pin names follow the MCU (FDCANn, port pins). Each role's
  backplane routes some of them; the roles table labels those with their car
  signal, for display only: systems name the MCU's pins.
platform: stm32h733
# Which pins exist and leave the module comes from the MainLite's published pin
# model (catalog/pin-models/, isc-fs/IFS08-ES-MainLite pin-model-v1.0; vendored
# by scripts/update-pin-model.sh). Every pin it routes to the backplane headers
# J3/J4 is a connector or pin of this board, below, and the emulator wires
# every one (can, spi, uart, gpio, analog_in). On-board peripherals (`onboard`)
# are the only others a system may use.
pin_model: mainlite.pins.yaml
# Every MainLite carries the CAN bootloader in sector 0, burned at
# provisioning: it boots first, then jumps to the application after its 2 s
# auto-jump window (repo owner, 2026-10-05; stm32-can-bootloader v1.7.0
# ARCHITECTURE.md "Boot flow", PROVISIONING.md step 1.1).
bootloader: can-bootloader
# The role a MainLite is provisioned for (a system's `role:`): the node ID
# its bootloader answers to, and the bus its app is flashed over (owner,
# 2026-10-05; stm32-can-bootloader v1.7.0 PROVISIONING.md step 1.3, "ecu ->
# 0x1, ams -> 0x2, udv -> 0x3"). The role also sets the firmware (an ECU
# always runs the ECU application; there is no udv firmware in the catalogue
# yet, so a system can't place a uDV until there is).
#
# `pins` are the connectors and pins the role's backplane routes, each with
# the car signal it carries: display labels for the editor, never endpoint
# aliases (systems keep `ecu.PF8`). Anything else of the board, but for
# `onboard`, is not connected on that backplane, and wiring it is a warning.
# `gpio` re-kinds a pin the board models as an analog input where the
# backplane uses it as a digital line. Traced in docs/backplanes/ (pin map
# tables), which cite the schematics and firmware for each row.
roles:
  ecu:
    node_id: 0x1
    flash_bus: FDCAN2
    firmware: ecu
    backplane: {name: ECU, doc: docs/backplanes/ecu.md}
    # docs/backplanes/ecu.md, "Pin map" (BACKPLANE ECU v3.0).
    pins:
      FDCAN1: CAN_INV      # CAN_H/L_INV, J1.9/J1.10: the inverter
      FDCAN2: CAN_ACU      # nets CAN_H/L_TEL (stale name), J1.11/J1.12: the ACU bus
      FDCAN3: CAN_DASH     # nets CAN_H/L_SENS (stale name), J1.13/J1.14: the dash bus
      SPI1: NRF24          # the nRF24's pins, bit-banged by the firmware (nrf24.c)
      PB4: RTDS            # J1.20, unbuffered (IFS08-CE-ECU#254)
      PB5: START           # START_FIL <- J1.19
      PF7: S_BRAKE         # S_BRAKE_FIL <- J1.18
      PF8: APPS_1          # J1.3
      PF9: APPS_2          # J1.6
      PB9: SPARE_J3        # D6, header J3 only
      PC1: SPARE_J3        # A6, header J3 only
      PB6: DISCHARGE       # D3, the firmware's DC-link discharge; header J3.18 only, no driver (IFS08-CE-ECU#253)
      PD5: S_TEMP_REFRI    # J1.15, 1-Wire; no firmware
      USART10: GPS         # PG11/PG12
      PB0: NRF24_CS        # on board
      PC5: NRF24_CE        # on board
      PC4: NRF24_IRQ       # on board
      PB7: SPARE_J3        # D4, header J3 only
      PB8: SPARE_J3        # D5, header J3 only
      PF10: SPARE_J3       # A4, header J3 only
      PC0: SPARE_J3        # A5, header J3 only
      PC2_C: SPARE_J3      # PC2, header J3 only
  ams:
    node_id: 0x2
    flash_bus: FDCAN1
    firmware: ams
    backplane: {name: AMS, doc: docs/backplanes/ams.md}
    # docs/backplanes/ams.md, "Pin map" (AMS IFS08). FDCAN2 and FDCAN3 are
    # no-connect.
    pins:
      FDCAN1: CAN_ACU      # CAN_H/L_ACU, J1.9/J1.10, H/L swapped (IFS08-CE-AMS#621)
      SPI1: LTC6820        # U4 LTC6820, isoSPI through T1 to J5
      PB9: LTC6820_CS      # U4 chip select, on board
      PB4: AMS_OK          # K5 AMS latch relay, J1.4
      PB5: AIR_P           # AIR+ coil low side, J11.6; TSAL J7.4
      PF7: S_CURRENT_P     # pack current sensor OUTP, J4.3
      PF8: S_CURRENT_N     # pack current sensor OUTN, J4.2
      PF9: TSMS            # TSMS_FIL, a digital input (main.h:70 TSMS_Pin)
      PC1: S_CURRENT_DCDC  # J3.5, the DC-DC's ACS758; not fitted, not sampled
      PB6: AIR_N           # J11.5 (main.h:78 RELAY_AIR_N_Pin)
      PB7: PRECHARGE       # J11.4 (main.h:80 RELAY_PRECHARGE_Pin)
      PF10: RST_PIL        # RST_PIL_FIL, a digital input (main.h:72 DASH_CHG_Pin)
      PC0: S_TEMP_DCDC     # J3.7; not read
      PB8: SPARE           # J1.20
      PB0: SPARE           # J1.21
      PC2_C: SPARE         # PC2, J1.22
    # TSMS and DASH_CHG are digital inputs on this backplane, not ADC
    # channels (AMS.ioc: PF10.Signal=GPIO_Input, GPIO_PULLDOWN).
    gpio:
      PF9: {port: sysbus.gpioPortF, pin: 9}
      PF10: {port: sysbus.gpioPortF, pin: 10}
  udv:
    node_id: 0x3
    flash_bus: FDCAN2
    firmware: udv
    backplane: {name: uDV, doc: docs/backplanes/udv.md}
    # docs/backplanes/udv.md, "Pin map" (MicroDV2, IFS09-DV-uDV
    # feat/5-hardware). FDCAN3 is no-connect (IFS09-DV-uDV#6), and SPI1 is
    # not routed.
    pins:
      FDCAN1: CAN_DV       # the DV datalogger / RES net, J6.15-J6.22
      FDCAN2: CAN_ACU      # /CAN H 2, /CAN L 2, J6.13/J6.14: the ACU bus
      PB4: EBS_VALVE1      # /EBS micro 1 (D1), J10.2
      PB5: EBS_VALVE2      # /EBS Micro 2 (D2), J10.6
      PB9: ASSI_BLUE       # /PWM blue (D6), J6.1/J6.3/J6.5
      PF7: EBS_PRES1       # /Micro in pres 1 (A1), J6.27
      PF8: EBS_PRES2       # /Micro in pres 2 (A2), J6.28
      PF9: EBS_24V         # /Micro in EBS (A3), from /24V EBS, on board
      PC1: DEBUG_LED2      # /Debug 2, LED D27, on board
      PB6: DEBUG_LED1      # /Debug 1, LED D26, on board
      PB7: SDC_CTRL        # /Control SDC Micro (D4), the K1 SDC relay
      PB8: ASSI_YELLOW     # /PWM yellow (D5)
      PF10: SDC_SENSE      # /Sensor SDC micro (A4), from /SDC out, on board
      PC0: RES_IN          # /Lectura RES (A5), J6.29
      PC2_C: DEBUG_LED3    # PC2, /Debug 3, LED D28, on board
    # PC1 and PC2 drive debug LEDs on this backplane: outputs, not ADC
    # channels. PC2 is the digital side of the PC2_C pad, reaching it only
    # with the SYSCFG_PMCR PC2SO analog switch closed (stm32h733xx.h:19269-19271,
    # PC2SO bit 26; RM0468 SYSCFG_PMCR). The emulator does not model the
    # switch: a GPIO endpoint on PC2_C is GPIOC pin 2 either way.
    gpio:
      PC1: {port: sysbus.gpioPortC, pin: 1}
      PC2_C: {port: sysbus.gpioPortC, pin: 2}
# No coin cell or supercap on VBAT, so a power cut wipes the backup domain:
# the RTC backup registers (the AMS's sticky ErrorLatch, BKP1R) start clear.
# Source: IFS08-CE-AMS app_init_task.cpp:78-80; the pin model agrees (VBAT,
# pin 6, unconnected: interfaces.vbat.backup_battery false).
vbat: false
# On the MainLite itself, not through a backplane: connected in every role
# (docs/backplanes/README.md, "Common to every unit").
onboard:
  SDMMC1: microSD
  I2C2: BMI088
can:
  FDCAN1: sysbus.fdcan1_h7
  FDCAN2: sysbus.fdcan2_h7
  FDCAN3: sysbus.fdcan3_h7
spi:
  SPI1: sysbus.spi1
uart:
  # PG11 RX / PG12 TX, J3.4/J3.5: the ECU's GPS (ECU.ioc: PG11/PG12 USART10,
  # Asynchronous). platforms/cpus/stm32h733.repl's usart10, an STM32F7_USART
  # at USART10_BASE = D2_APB2PERIPH_BASE + 0x1C00 = 0x40011C00, USART10_IRQn =
  # 156 (stm32h733xx.h:2353, 2194, 194).
  USART10: sysbus.usart10
sdmmc:
  SDMMC1: sysbus.sdmmc1
i2c:
  # PF0 SDA / PF1 SCL, to the MainLite's BMI088 (MAIN_LITE IC1; IFS08-CE-AMS
  # stm32h7xx_hal_msp.c:282-291, ams_config.hpp:343-346).
  I2C2: sysbus.i2c2_h7
gpio:
  # Software chip-select of SPI1 on the AMS (main.h: LTC_CS, PB9).
  PB9: {port: sysbus.gpioPortB, pin: 9}
  # The ECU's RTDS buzzer output and START button input (main.h: RTDS_Pin
  # PB4, START_Pin PB5).
  PB4: {port: sysbus.gpioPortB, pin: 4}
  PB5: {port: sysbus.gpioPortB, pin: 5}
  # J3.8-J3.10, GPIO3-GPIO5: AMS AIR- and precharge relays (IFS08-CE-AMS
  # main.h:80-83 RELAY_AIR_N / RELAY_PRECHARGE); ECU D3-D5, PB6 its DC-link
  # discharge (IFS08-CE-ECU control_task.cpp:296-301); uDV debug LED, SDC
  # relay, ASSI yellow (docs/backplanes/).
  PB6: {port: sysbus.gpioPortB, pin: 6}
  PB7: {port: sysbus.gpioPortB, pin: 7}
  PB8: {port: sysbus.gpioPortB, pin: 8}
  # J3.3 DS18B20_REFRI: 1-Wire, 4k7 pull-up R10 on the MainLite. A plain GPIO:
  # no 1-Wire device is modelled, and no firmware drives it yet.
  PD5: {port: sysbus.gpioPortD, pin: 5}
  # J4.9-J4.11: the ECU's nRF24 chip select, CE and IRQ (ECU.ioc: PB0
  # NRF24_CS out, PC5 NRF24_CE out, PC4 NRF24_IRQ in). Plain GPIOs: no radio
  # is modelled.
  PB0: {port: sysbus.gpioPortB, pin: 0}
  PC5: {port: sysbus.gpioPortC, pin: 5}
  PC4: {port: sysbus.gpioPortC, pin: 4}
analog_in:
  # ADC3 inputs routed to the MainLite's connector (IFS_HIL vcu_profile.yaml).
  PF7: {adc: sysbus.adc3_h73x, channel: 3}
  PF8: {adc: sysbus.adc3_h73x, channel: 7}
  PF9: {adc: sysbus.adc3_h73x, channel: 2}
  # Single-ended. The AMS backplane routes it to J3.5, the DC-DC's ACS758
  # (docs/backplanes/ams.md), but AMS dev does not sample it, by design: no
  # DC-DC is fitted (IFS08-CE-AMS af07ec8; ams_config.hpp:607, :713-715).
  PC1: {adc: sysbus.adc3_h73x, channel: 11}
  # J3.15, J3.16, J3.18 (GPIO10, GPIO11, GPIO13). Channels from ST's pin data
  # (STM32_open_pin_data 7d1f151 STM32H733ZGTx.xml, the pin model's source):
  # PF10 ADC3_INP6, PC0 ADC1/2/3_INP10, PC2_C ADC3_INP0. Every firmware samples
  # them on ADC3, the only ADC its .ioc enables (Mcu.IP0=ADC3), so that is the
  # ADC here: ECU.ioc (dev) :233-237 PF10 ADC3_INP6 (A4), :204-207 + :420 PC0
  # ADCx_INP10 = ADC3_INP10 (A5); uDV.ioc (dev) :288-292, :246-249 + :476 the
  # same, and :254-258 PC2_C ADC3_INP0 (A7). The AMS reads PF10 as a GPIO
  # (its role, above; AMS.ioc :266-270) and configures neither PC0 nor PC2_C.
  # PC2_C is the analog pad, on ADC3 INP0 whatever the SYSCFG_PMCR PC2SO
  # switch (which joins it to digital PC2; RM0468 SYSCFG_PMCR), which
  # models/renode/Stm32H7Adc3.cs does not model: channel 0 reads its voltage.
  PF10: {adc: sysbus.adc3_h73x, channel: 6}
  PC0: {adc: sysbus.adc3_h73x, channel: 10}
  PC2_C: {adc: sysbus.adc3_h73x, channel: 0}
