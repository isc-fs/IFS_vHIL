kind: board
id: mainlite
description: >-
  MainLite: the minimal STM32H733ZG unit. Mounted on a backplane it becomes
  the AMS, the ECU or the uDV.
  Connector and pin names follow the MCU (FDCANn, port pins); what a
  backplane and its firmware use them for belongs to the system, not the board.
platform: stm32h733
# Every MainLite carries the CAN bootloader in sector 0, burned at
# provisioning: it boots first, then jumps to the application after its 2 s
# auto-jump window (repo owner, 2026-10-05; stm32-can-bootloader v1.7.0
# ARCHITECTURE.md "Boot flow", PROVISIONING.md step 1.1).
bootloader: can-bootloader
# The role a MainLite is provisioned for (a system's `role:`): the node ID
# its bootloader answers to, and the bus its app is flashed over (owner,
# 2026-10-05; stm32-can-bootloader v1.7.0 PROVISIONING.md step 1.3, "ecu ->
# 0x1, ams -> 0x2, udv -> 0x3"). Each role's natural firmware is the
# catalogue's of the same name (ecu, ams; no udv yet), but a system names it.
roles:
  ecu: {node_id: 0x1, flash_bus: FDCAN2}
  ams: {node_id: 0x2, flash_bus: FDCAN1}
  udv: {node_id: 0x3, flash_bus: FDCAN2}
# No coin cell or supercap on VBAT, so a power cut wipes the backup domain:
# the RTC backup registers (the AMS's sticky ErrorLatch, BKP1R) start clear.
# Source: IFS08-CE-AMS app_init_task.cpp:78-80; to confirm on the MainLite
# schematic.
vbat: false
can:
  FDCAN1: sysbus.fdcan1_h7
  FDCAN2: sysbus.fdcan2_h7
  FDCAN3: sysbus.fdcan3_h7
spi:
  SPI1: sysbus.spi1
sdmmc:
  SDMMC1: sysbus.sdmmc1
i2c:
  # PF0 SDA / PF1 SCL, to the MainLite's BMI088 (MAIN_LITE IC1; IFS08-CE-AMS
  # stm32h7xx_hal_msp.c:282-291, ams_config.hpp:343-346).
  I2C2: sysbus.i2c2_h7
gpio:
  # Software chip-select of SPI1 on the AMS (main.h: LTC_CS, PB9).
  PB9: {port: sysbus.gpioPortB, pin: 9}
  # The ECU's RTDS buzzer output and START button input (main.h: RTDS_Pin
  # PB4, START_Pin PB5).
  PB4: {port: sysbus.gpioPortB, pin: 4}
  PB5: {port: sysbus.gpioPortB, pin: 5}
analog_in:
  # ADC3 inputs routed to the MainLite's connector (IFS_HIL vcu_profile.yaml).
  PF7: {adc: sysbus.adc3_h73x, channel: 3}
  PF8: {adc: sysbus.adc3_h73x, channel: 7}
  PF9: {adc: sysbus.adc3_h73x, channel: 2}
  # Single-ended. The AMS backplane routes it to J3.5, the DC-DC's ACS758
  # (docs/backplanes/ams.md), but AMS dev does not sample it, by design: no
  # DC-DC is fitted (IFS08-CE-AMS af07ec8; ams_config.hpp:607, :713-715).
  PC1: {adc: sysbus.adc3_h73x, channel: 11}
