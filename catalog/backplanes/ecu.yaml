kind: backplane
id: ecu
description: >-
  The ECU backplane (BACKPLANE ECU v3.0): a MainLite on it is the vehicle
  control unit. It brings in the pedal sensors and the START button, drives
  the RTDS buzzer, and carries the inverter, ACU and dash buses, the GPS and
  the nRF24 telemetry radio.
  Source: isc-fs/IFS08-ES boards/BACKPLANE_ECU/kicad/BACKPLANE_ECU.kicad_sch
  (MCU1, MAIN_LITE) and the ECU firmware (IFS08-CE-ECU Core/Inc/main.h,
  the .ioc, Core/Inc/app/can_frame.hpp).
mounts: mainlite
signals:
  # CAN_1 (MainLite U2 = FDCAN1) -> CAN_H_INV / CAN_L_INV, J1.9/10, J2.1/2:
  # the inverter (can_frame.hpp:25 CanBus::Inv).
  CAN_INV: FDCAN1
  # CAN_2 (U3 = FDCAN2) -> nets CAN_H_TEL / CAN_L_TEL, J1.11/12: the
  # firmware's ACU bus, to the AMS and the uDV (can_frame.hpp:26). The
  # schematic's "TEL" name is stale.
  CAN_ACU: FDCAN2
  # CAN_3 (U4 = FDCAN3) -> nets CAN_H_SENS / CAN_L_SENS, J1.13/14: the
  # firmware's dash bus, transmit-only (can_frame.hpp:27). The schematic
  # calls it "SENS".
  CAN_DASH: FDCAN3
  # GPIO1 -> RTDS, J1.20, straight from the pin (main.h:82 RTDS_Pin).
  RTDS: PB4
  # GPIO2 -> START_FIL: START (J1.19) through R6 1k / R7 2k and D4
  # (main.h:84 START_Pin, high = pressed).
  START: PB5
  # GPIO7 -> S_BRAKE_FIL: S_BRAKE (J1.18) through R8 1k / R9 2k and D5,
  # ADC3 INP3 (main.h:60 S_BRAKE_Pin).
  S_BRAKE: PF7
  # GPIO8 -> APPS_1, J1.3, R1 100k / C1 100n, ADC3 INP7 (main.h:62).
  APPS_1: PF8
  # GPIO9 -> APPS_2, J1.6, R2 100k / C2 100n, ADC3 INP2 (main.h:64).
  APPS_2: PF9
  # Routed but not pins of the board entry yet: PD5 S_TEMP_REFRI (J1.15,
  # 1-Wire, no firmware), PG11/PG12 to the GPS (USART10), PB0/PC5/PC4 and
  # SPI1 to the nRF24 (bit-banged, nrf24.c), PB6 (firmware's DC-link
  # discharge, only to header J3.18). PB7-PB9, PF10, PC0-PC2 go to header J3
  # only; PB9 and PC1 are spare on this backplane.
