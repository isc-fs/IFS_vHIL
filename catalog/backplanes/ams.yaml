kind: backplane
id: ams
description: >-
  The AMS backplane (AMS IFS08): a MainLite on it is the accumulator
  management system. It carries the LTC6820 isoSPI master for the battery
  chain, the pack and DC-DC current-sensor inputs, the AIR/precharge and
  AMS_OK relay drivers, and the ACU bus.
  Source: IFS08-CE-AMS pcbs/AMS IFS08/AMS IFS08.kicad_sch (MCU1, MAIN_LITE)
  and the AMS firmware (Core/Inc/main.h, AMS.ioc, ams_config.hpp).
mounts: mainlite
signals:
  # CAN_1 (MainLite U2 = FDCAN1) -> nets CAN_H_ACU / CAN_L_ACU, J1.9/J1.10,
  # R35 120R: the accumulator bus (ams_config.hpp:521, :584). The net names
  # land H on CANL_1 and L on CANH_1: swapped labels or a crossed harness.
  # CAN_2 and CAN_3 are no-connect on this backplane.
  CAN_ACU: FDCAN1
  # GPIO6 -> LTC6820_CS: U4 LTC6820 CS (main.h:82 LTC6820_CS_Pin). SPI1
  # MOSI/MISO/SCK go to U4 too; U4's IP/IM reach the BMS chain on J5
  # through T1.
  LTC6820_CS: PB9
  # GPIO1 -> AMS_OK: R21/Q10, the K5 AMS latch relay in the shutdown
  # circuit, and J1.4 (main.h:74 AMS_OK_Pin).
  AMS_OK: PB4
  # GPIO2 -> AIR+: R7/Q2, the AIR+ coil low side on J11.6, and J7.4 TSAL
  # (main.h:76 RELAY_AIR_P_Pin).
  AIR_P: PB5
  # GPIO7/GPIO8 -> S_CURRENT_P / S_CURRENT_N: R10/R11 100R to J4.3/J4.2,
  # the pack current sensor's OUTP/OUTN, ADC3 INP3/INN3 differential
  # (main.h:66-69).
  S_CURRENT_P: PF7
  S_CURRENT_N: PF8
  # GPIO12 -> S_CURRENT_DCDC: J3.5, the DC-DC's ACS758. The AMS firmware's
  # dev branch does not sample it (ams_config.hpp:607, "no DCDC fitted").
  S_CURRENT_DCDC: PC1
  # Routed but not pins of the board entry as such: PB6 AIR- (J11.5), PB7
  # PRECHARGE (J11.4), PF10 RST_PIL_FIL (firmware DASH_CHG), PC0
  # S_TEMP_DCDC (J3.7), PB8/PB0/PC2 spare to J1.20-22. PF9 is TSMS_FIL, a
  # digital input in the firmware (main.h:70 TSMS_Pin), not the analog
  # input the board entry models, so it is left out.
