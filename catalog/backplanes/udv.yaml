kind: backplane
id: udv
description: >-
  The uDV backplane (MicroDV2): a MainLite on it is the driverless
  controller. It drives the EBS valves and the SDC relay, senses the EBS
  pressures and 24 V, and takes the DV CAN (RES, datalogger) and the ACU bus.
  Source: IFS09-DV-uDV MicroDV_PCB_Schematics/MicroDV2/MicroDV2.kicad_sch
  (MCU1, MAIN_LITE) and the uDV firmware (Core/Inc/main.h, uDV.ioc).
mounts: mainlite
signals:
  # CAN_1 (MainLite U2 = FDCAN1) -> nets "/CAN 1 L/H DATALOGGER", J6.15-22:
  # datalogger, IMU, steering motor. Firmware: the RES CANopen and the DV
  # datalogger frames (can_interface.cpp:114-150, :670-700).
  CAN_DV: FDCAN1
  # CAN_2 (U3 = FDCAN2) -> "/CAN H 2" / "/CAN L 2", J6.13/14: the ACU bus to
  # the ECU (can_interface.cpp:152-213).
  CAN_ACU: FDCAN2
  # FDCAN3 (CAN_3) is no-connect on MicroDV2, though the firmware runs
  # steering, AMI and ASSI frames on it (can_interface.cpp:584-723).
  # GPIO1 -> "/EBS micro 1 (D1)": Q3 low side of EBS valve 1, J10.2 (main.h:84
  # D1; hardware_io.c:84-87, low = fire).
  EBS_VALVE1: PB4
  # GPIO2 -> "/EBS Micro 2 (D2)": Q4, EBS valve 2, J10.6 (main.h:86 D2).
  EBS_VALVE2: PB5
  # GPIO6 -> "/PWM blue (D6)": Q7/Q8, ASSI blue (-) J6.1/3/5 (main.h:94 D6,
  # never driven by the firmware).
  ASSI_BLUE: PB9
  # GPIO7 -> "/Micro in pres 1 (A1)": J6.27 through 10k/5k (main.h:64 A1).
  EBS_PRES1: PF7
  # GPIO8 -> "/Micro in pres 2 (A2)": J6.28 through 10k/5k (main.h:66 A2).
  EBS_PRES2: PF8
  # GPIO9 -> "/Micro in EBS (A3)": "/24V EBS" through 10k/1k (main.h:68 A3).
  EBS_24V: PF9
  # Routed but not pins of the board entry yet: PB6 "/Debug 1" LED, PB7
  # "/Control SDC Micro (D4)" (K1 SDC relay), PB8 "/PWM yellow (D5)" (ASSI
  # yellow), PF10 "/Sensor SDC micro (A4)", PC0 "/Lectura RES (A5)", PC2
  # "/Debug 3" LED. PC1 ("/Debug 2" LED) is an output here, not the analog
  # input the board entry models, so it is left out.
