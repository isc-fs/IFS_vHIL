[pytest]
testpaths = tests
markers =
    soak: long virtual-time runs (tens of minutes); opt in with -m soak
    beyond_bench: a scenario tagged beyond-bench: it needs what the physical bench lacks (the tractive-system plant, docs/m8-plan.md), so it never gates a parity run; -m "not beyond_bench" leaves it out
addopts = -m "not soak"
