[pytest]
testpaths = tests
# --strict-markers: a marker must be registered here. The board, system and
# subsystem markers tag each tests/sim file for CI's impact selection
# (ci/impact.yaml, scripts/ci-select.py, docs/ci.md); `-m` selects by them
# locally too (`pytest tests/sim -m "ams and sd"`).
markers =
    soak: long virtual-time runs (tens of minutes); opt in with -m soak
    beyond_bench: a scenario tagged beyond-bench: it needs what the physical bench lacks (the tractive-system plant, docs/m8-plan.md), so it never gates a parity run; -m "not beyond_bench" leaves it out
    ecu: runs the ECU's firmware (board, role ecu)
    ams: runs the AMS's firmware (board, role ams)
    udv: runs the uDV's firmware (board, role udv)
    system_ecu: boots systems/ecu.yaml
    system_ams: boots systems/ams.yaml
    system_udv: boots systems/udv.yaml
    system_ecu_ams: boots systems/ecu-ams.yaml
    system_ecu_ams_udv: boots systems/ecu-ams-udv.yaml
    system_ecu_ams_ecu: boots the three-board benchmark scripts/speed-systems/ecu-ams-ecu.yaml
    can: subsystem: FDCAN, the CAN bus model, a board's CAN contract
    bootloader: subsystem: the CAN bootloader, reflashing over CAN
    flash: subsystem: the flash controller, option bytes, write protection
    adc: subsystem: ADC3 and the analog sources behind it
    dma: subsystem: DMA1/2, DBGMCU, lazy DMA hand-over
    sd: subsystem: SDMMC1 and the SD card model
    isospi: subsystem: SPI1, the LTC6820 and the LTC6811 chain
    i2c: subsystem: I2C and the BMI088
    radio: subsystem: the nRF24L01+ on bit-banged GPIO
    plant: subsystem: co-simulation, scripted and FMI plants
    timers: subsystem: STM32 timers, PWM
    cpu_timing: subsystem: the core's rate (cpu.mips), DWT, caches
    fast_forward: subsystem: busy-wait fast-forward and other speed paths that must not change a run
    fault_hooks: subsystem: injected faults (bus-off, SPI, CPU faults, wedged tasks)
    reset: subsystem: resets, reset causes, power cycles, the backup domain
    live_session: subsystem: the live session (vhil/server/session.py)
    server: subsystem: the web app's run path (vhil/server, vhil/worker.py)
    debugger: subsystem: the GDB debugger (vhil/gdb.py, VhilGdb.cs)
    broker: subsystem: the virtual broker's power path (vhil/broker.py)
    probe: subsystem: the test probe (VhilProbe.cs)
    quantum_opt_in: may start a Sim at the 1 ms sync quantum (#348; tests/conftest.py): only the opt-in's own determinism test, never a gate run
addopts = -m "not soak" --strict-markers
