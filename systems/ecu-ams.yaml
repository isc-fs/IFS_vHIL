kind: system
id: ecu-ams
description: >-
  The ECU and the AMS on the car's ACU bus, each on its own MLC carrier. The
  AMS carries its battery chain, SD card and current sensors as in ams.yaml.
  IFS_HIL's real-AMS block (F-real) runs against it.
time:
  quantum_s: 0.0005
boards:
  ecu: {board: mlc-carrier, firmware: ecu}
  ams: {board: mlc-carrier, firmware: ams}
buses:
  # As in ecu.yaml. The ACU bus is the one the two share in the car: the
  # ECU's FDCAN2 (its 0x100 heartbeat, tests/sim/test_ecu_boot.py) and the
  # AMS's FDCAN1, its accumulator bus (IFS08-CE-AMS app_init_task.cpp).
  can_inv:  {kind: can, nodes: [ecu.FDCAN1], host_netdev: can0}
  can_dash: {kind: can, nodes: [ecu.FDCAN3], host_netdev: can1}
  can_acu:  {kind: can, nodes: [ecu.FDCAN2, ams.FDCAN1], host_netdev: can2}
devices:
  # The AMS's, as in ams.yaml.
  isospi: {model: ltc6820, spi: ams.SPI1, cs: ams.PB9}
  cells: {model: ltc6811, attach: isospi, count: 10}
  sd: {model: sd-card, sdmmc: ams.SDMMC1}
  pack_current: {model: ssa-2-250a, outputs: {out_p: ams.PF7, out_n: ams.PF8}}
  dcdc_current: {model: acs758lcb-050b, outputs: {out: ams.PC1}}
bench:
  carriers:
    # MLC4 (ECU): relay K4 = TCA 0x20 port 0 pin 3, current monitor INA 0x45.
    - {board: ecu, slot: 4, relay: {addr: 0x20, port: 0, pin: 3}, ina_addr: 0x45, current_A: 0.13}
    # MLC2 (AMS): relay K2 = TCA 0x20 port 0 pin 1, current monitor INA 0x41.
    - {board: ams, slot: 2, relay: {addr: 0x20, port: 0, pin: 1}, ina_addr: 0x41, current_A: 0.12}
  dac_routes:
    # bench DAC1 -> ECU pedal inputs (vcu_profile: brake, APPS1, APPS2)
    - {dac: 0, channel: 0, to: ecu.PF7}
    - {dac: 0, channel: 1, to: ecu.PF8}
    - {dac: 0, channel: 2, to: ecu.PF9}
    # bench DAC4 -> the AMS pack-current pair (IFS_HIL bench-01.yaml
    # routing.pack_current). When a test drives it, it overrides the
    # pack_current sensor's output.
    - {dac: 3, channel: 0, to: ams.PF7}
    - {dac: 3, channel: 1, to: ams.PF8}
