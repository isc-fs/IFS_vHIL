kind: system
id: ecu-ams
description: >-
  The ECU and the AMS on the car's ACU bus, each a MainLite on its own backplane. The
  AMS carries its battery chain, SD card and current sensors as in ams.yaml.
  IFS_HIL's real-AMS block (F-real) runs against it.
time:
  quantum_s: 0.0005
boards:
  # Each a MainLite in its role, which sets its firmware, node ID and flash
  # bus (catalog/boards/mainlite.yaml): ECU node 0x1 flashed over FDCAN2,
  # AMS node 0x2 over FDCAN1. Both boot through their CAN bootloader, as in
  # ecu.yaml and ams.yaml.
  ecu: {board: mainlite, role: ecu}
  ams: {board: mainlite, role: ams}
buses:
  # As in ecu.yaml. The ACU bus is the one the two share in the car: the
  # ECU's FDCAN2 (its 0x100 heartbeat, tests/sim/test_ecu_boot.py) and the
  # AMS's FDCAN1, its accumulator bus (IFS08-CE-AMS app_init_task.cpp).
  can_inv:  {kind: can, nodes: [ecu.FDCAN1], host_netdev: can0}  # CAN_H/L_INV, J1.9/J1.10 (docs/backplanes/ecu.md)
  can_dash: {kind: can, nodes: [ecu.FDCAN3], host_netdev: can1}  # net CAN_H/L_SENS (stale name), J1.13/J1.14 (docs/backplanes/ecu.md)
  can_acu:  {kind: can, nodes: [ecu.FDCAN2, ams.FDCAN1], host_netdev: can2}  # ECU J1.11/J1.12 (net CAN_H/L_TEL), AMS J1.9/J1.10 (CAN_H/L_ACU, H/L swapped) (docs/backplanes/ecu.md, ams.md)
devices:
  # The ECU's nRF24L01+ telemetry radio, as in ecu.yaml.
  radio: {model: nrf24l01p, pins: {csn: ecu.PB0, sck: ecu.PA5, mosi: ecu.PA7, miso: ecu.PA6, ce: ecu.PC5, irq: ecu.PC4}}  # NRF24_CS/SCK/MOSI/MISO/CE/IRQ, on board (docs/backplanes/ecu.md)
  # The AMS's, as in ams.yaml.
  isospi: {model: ltc6820, spi: ams.SPI1, cs: ams.PB9}  # SPI1 + LTC6820_CS -> U4 LTC6820 (docs/backplanes/ams.md)
  cells: {model: ltc6811, attach: isospi, count: 10}
  sd: {model: sd-card, sdmmc: ams.SDMMC1}
  # The MainLite's BMI088 on I2C2 (accelerometer 0x18, gyroscope 0x68:
  # SDO1/SDO2 to GND, ams_config.hpp ImuAccAddr7b/ImuGyrAddr7b), which
  # the AMS's ImuTask samples at 100 Hz into IMUnnnn.CSV on the card.
  imu: {model: bmi088, i2c: ams.I2C2}
  pack_current: {model: ssa-2-250a, outputs: {out_p: ams.PF7, out_n: ams.PF8}}  # S_CURRENT_P/N -> J4.3/J4.2 (docs/backplanes/ams.md)
  dcdc_current: {model: acs758lcb-050b, outputs: {out: ams.PC1}}  # S_CURRENT_DCDC -> J3.5, not sampled on AMS dev (docs/backplanes/ams.md)
plants:
  # The car's tractive system (M8, #147; docs/m8-plan.md): AIR+, AIR- and
  # the precharge relay on the AMS's coil drives, the inverter's DC link and
  # its 0x466 report (v_link). Runs in scenarios and web-app runs, never on
  # the wall-clock bench (IFS_HIL parity keeps its own linear ramp). Every
  # parameter's source is in catalog/plants/tractive-system.yaml.
  # The shutdown circuit (TS-2, #147; docs/m8-plan.md "TS-2"): the AMS
  # backplane's IMD and AMS latch relays and the harness's switches in
  # series, ending in AIR+_VCC, the coils' supply, which it drives on PF9.
  # Its inputs (tsms, the RST_EXT `reset` button, ...) are set by scenario
  # rows, never by driving PF9. catalog/plants/shutdown-circuit.yaml.
  sdc: {plant: shutdown-circuit}
  ts: {plant: tractive-system, cells: isospi}
port:
  # The co-simulation port (vhil/cosim.py). The tractive-system plant's
  # signals (vhil/plant_ts.py, docs/m8-plan.md) are named as the IFSSIM
  # electrical FMU's (isc-fs/IFSSIM#669); the inverter's as in ecu.yaml,
  # except that its DC-link report is `v_link`, the plant's.
  step_ms: 10
  signals:
    air_pos_cmd:   {gpio_out: ams.PB5}  # AIR+ coil low side, Q2 -> J11.6 (docs/backplanes/ams.md)
    air_neg_cmd:   {gpio_out: ams.PB6}  # AIR- coil low side, Q1 -> J11.5 (docs/backplanes/ams.md)
    pre_cmd:       {gpio_out: ams.PB7}  # PRECHARGE coil low side, Q3 -> J11.4 (docs/backplanes/ams.md)
    discharge_cmd: {gpio_out: ecu.PB6}  # DC-link discharge coil-interrupt, header J3.18 only (docs/backplanes/ecu.md)
    sdc_closed:    {gpio_in: ams.PF9}   # TSMS_FIL senses AIR+_VCC, the coils' supply (docs/backplanes/ams.md)
    ams_ok:        {gpio_out: ams.PB4}  # AMS_OK -> Q10 -> K5 AMS latch coil, J1.4 (docs/backplanes/ams.md)
    v_link:        {can_tx: {bus: can_inv, id: 0x466}}
    inv_cmd:       {can_rx: {bus: can_inv, id: 0x360}}
    inv_torque:    {can_rx: {bus: can_inv, id: 0x362}}
    inv_state:     {can_tx: {bus: can_inv, id: 0x461}}
    inv_rpm:       {can_tx: {bus: can_inv, id: 0x463}}
bench:
  power:
    # Slot 4 (ECU): relay = TCA 0x20 port 0 pin 3, current monitor INA 0x45.
    - {board: ecu, slot: 4, relay: {addr: 0x20, port: 0, pin: 3}, ina_addr: 0x45, current_A: 0.13}
    # Slot 2 (AMS): relay = TCA 0x20 port 0 pin 1, current monitor INA 0x41.
    - {board: ams, slot: 2, relay: {addr: 0x20, port: 0, pin: 1}, ina_addr: 0x41, current_A: 0.12}
  dac_routes:
    # bench DAC1 -> ECU pedal inputs (vcu_profile: brake, APPS1, APPS2)
    - {dac: 0, channel: 0, to: ecu.PF7}  # S_BRAKE_FIL (docs/backplanes/ecu.md)
    - {dac: 0, channel: 1, to: ecu.PF8}  # APPS_1 (docs/backplanes/ecu.md)
    - {dac: 0, channel: 2, to: ecu.PF9}  # APPS_2 (docs/backplanes/ecu.md)
    # bench DAC4 -> the AMS pack-current pair (IFS_HIL bench-01.yaml
    # routing.pack_current). When a test drives it, it overrides the
    # pack_current sensor's output.
    - {dac: 3, channel: 0, to: ams.PF7}  # S_CURRENT_P (docs/backplanes/ams.md)
    - {dac: 3, channel: 1, to: ams.PF8}  # S_CURRENT_N (docs/backplanes/ams.md)
  gpio_routes:
    # IOEXP3 (TCA 0x22) P10 -> the ECU's START (vcu_profile start_btn_tca_*).
    # Used when the profile sets start_btn_via_can: false (IFS_HIL#150).
    - {tca: 0x22, port: 1, pin: 0, to: ecu.PB5}    # START_FIL <- J1.19 (docs/backplanes/ecu.md)
    # IOEXP2 (TCA 0x21) port 1 -> the AMS's cockpit inputs (IFS_HIL
    # bench-01.yaml routing.tsms / routing.dash_chg).
    - {tca: 0x21, port: 1, pin: 0, to: ams.PF9}    # P10 -> TSMS_FIL (docs/backplanes/ams.md)
    - {tca: 0x21, port: 1, pin: 1, to: ams.PF10}   # P11 -> RST_PIL_FIL, DASH_CHG (docs/backplanes/ams.md)
  adc_routes:
    # bench ADC1 (MCP3208 idx 0) ch0 taps the RTDS output (vcu_profile rtds_adc_*)
    - {adc: 0, channel: 0, from: ecu.PB4}  # RTDS, J1.20 (docs/backplanes/ecu.md)
    # bench ADC3 (MCP3208 idx 2) ch0-3 tap the AMS's relay drivers (IFS_HIL
    # bench-01.yaml routing.relay_readback).
    - {adc: 2, channel: 0, from: ams.PB4}  # AMS_OK (docs/backplanes/ams.md)
    - {adc: 2, channel: 1, from: ams.PB5}  # AIR+ (docs/backplanes/ams.md)
    - {adc: 2, channel: 2, from: ams.PB6}  # AIR- (docs/backplanes/ams.md)
    - {adc: 2, channel: 3, from: ams.PB7}  # PRECHARGE (docs/backplanes/ams.md)
  # bench-01's Pico LTC emulator seed, which it holds from its own cold boot
  # across the AMS's power cycles: 3750 mV cells, 25.0 C (IFS_HIL
  # tools/pico_ltc_emulator/firmware/src/cell_state.h DEFAULT_CELL_MV, README
  # "Default state on cold boot"). The model's own default stays 3700 mV.
  cell_stimulus: {device: isospi, cell_mV: 3750, temp_dC: 250}
