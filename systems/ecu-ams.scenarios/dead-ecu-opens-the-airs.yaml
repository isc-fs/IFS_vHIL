kind: scenario
system: ecu-ams
description: "A dead ECU faults the armed AMS VcuStale: the car armed to Run on the tractive-system plant as in car-arms-through-the-ecu (by 10600 ms at the latest, the AMS's PrechargeMaxMs after the press), then the ECU leaves the bus, rebooted into its CAN bootloader by the pit tool's 0x002 B007AD12 (allowed in WaitStartBrake; the AMS's own trigger is B007AD11) where it stays, sending no 0x100. 200 ms after the last heartbeat the AMS latches Error, reason VcuStale (11), opens AIR+, AIR- and PRE and drops AMS_OK, and reports Error on 0x4A0. A scenario cannot cut a board's power as the native test does (CPU halted); the reboot silences the ECU's app the same way. IFS08-CE-ECU can_rx_task.cpp:64-69, bootloader.hpp, ecu_config.hpp:656-658; IFS08-CE-AMS safety_predicates.hpp:253-254, ams_config.hpp:168; tests/sim/test_sys_ecu_ams.py test_a_dead_ecu_faults_the_armed_ams_vcu_stale."
virtual_ms: 13200
tags: [beyond-bench]
stimuli:
  - {kind: plant, name: sdc-reset, at_ms: 5400, plant: sdc, set: {reset: true}}
  - {kind: plant, name: sdc-reset-release, at_ms: 5450, plant: sdc, set: {reset: false}}
  - {kind: plant, name: tsms-on, at_ms: 5500, plant: sdc, set: {tsms: true}}
  - {kind: gpio, name: dash-press, at_ms: 5600, board: ams, pin: PF10, level: true}
  - {kind: gpio, name: dash-release, at_ms: 5650, board: ams, pin: PF10, level: false}
  - {kind: can_send, name: ecu-to-bootloader, at_ms: 10700, bus: can_acu, id: 0x002, data: "b007ad12"}
watch:
  - {kind: symbol, board: ams, name: g_state_telemetry, size: 1, period_ms: 10}
  - {kind: symbol, board: ams, name: g_mode_locked_telemetry, size: 1, period_ms: 10}
  - {kind: symbol, board: ams, name: g_fault_reason_telemetry, size: 1, period_ms: 10}
  - {kind: symbol, board: ecu, name: g_last_ctrl_state, size: 1, period_ms: 10}
expect:
  - {check: always, name: ams-start-before-tsms, at_ms: 4500, until_ms: 5500, signal: "symbol:ams.g_state_telemetry", value: 0}
  - {check: eventually, name: ams-precharge, at_ms: 5600, until_ms: 5700, signal: "symbol:ams.g_state_telemetry", value: 1}
  - {check: eventually, name: ams-run, at_ms: 5600, until_ms: 10600, signal: "symbol:ams.g_state_telemetry", value: 3}
  - {check: eventually, name: ts-active, at_ms: 5600, until_ms: 10700, signal: "frame:can_acu.VCU_ts_active.ts_active", value: 1}
  - {check: never, name: no-ams-error-while-fed, at_ms: 0, until_ms: 10890, signal: "symbol:ams.g_state_telemetry", value: 5}
  - {check: eventually, name: relayed-until-the-trigger, at_ms: 10600, until_ms: 10700, signal: "frame:can_acu.VCU_heartbeat.dc_bus_valid", value: 1}
  - {check: count, name: no-heartbeat-after-reboot, at_ms: 10800, signal: "frame:can_acu.VCU_heartbeat", max: 0}
  - {check: eventually, name: vcu-stale-error, at_ms: 10890, until_ms: 10960, signal: "symbol:ams.g_state_telemetry", value: 5}
  - {check: always, name: latched, at_ms: 11000, signal: "symbol:ams.g_state_telemetry", value: 5}
  - {check: always, name: reason-vcu-stale, at_ms: 11000, signal: "symbol:ams.g_fault_reason_telemetry", value: 11}
  - {check: always, name: air-plus-open, at_ms: 11000, signal: "pin:ams.PB5", value: low}
  - {check: always, name: air-minus-open, at_ms: 11000, signal: "pin:ams.PB6", value: low}
  - {check: always, name: precharge-open, at_ms: 11000, signal: "pin:ams.PB7", value: low}
  - {check: always, name: ams-ok-dropped, at_ms: 11000, signal: "pin:ams.PB4", value: low}
  - {check: eventually, name: error-on-can, at_ms: 10900, until_ms: 11500, signal: "frame:can_acu.AMS_status.fsm_state", value: 5}
  - {check: eventually, name: airs-open-on-the-plant, at_ms: 10900, until_ms: 11100, signal: "plant:ts.air_neg_closed", value: 0}
