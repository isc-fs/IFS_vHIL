kind: scenario
system: ecu-ams
description: "TS-1 fault, the precharge path never conducts (a blown resistor or a precharge relay that never closes; the plant's pre_open_circuit): TSMS and a DASH_CHG press arm Precharge, AIR- and PRE are driven, the link stays at 0 V, and PrechargeMaxMs (5000) after entering Precharge the AMS latches Error with reason FsmError (12), opening every contactor. AIR+ is never driven. IFS08-CE-AMS state_machine.hpp:329-345, ams_config.hpp:190, safety_predicates.hpp:56-57 (12 = the SafetyTask's FSM-driven Error)."
virtual_ms: 11500
tags: [beyond-bench]
stimuli:
  - {kind: plant, name: open-precharge, at_ms: 0, plant: ts, set: {"pre_open_circuit": true}}
  - {kind: gpio, name: tsms-on, at_ms: 5500, board: ams, pin: PF9, level: true}
  - {kind: gpio, name: dash-press, at_ms: 5600, board: ams, pin: PF10, level: true}
  - {kind: gpio, name: dash-release, at_ms: 5650, board: ams, pin: PF10, level: false}
watch:
  - {kind: symbol, board: ams, name: g_state_telemetry, size: 1, period_ms: 10}
  - {kind: symbol, board: ams, name: g_fault_reason_telemetry, size: 1, period_ms: 10}
  - {kind: symbol, board: ecu, name: g_last_ctrl_state, size: 1, period_ms: 10}
expect:
  - {check: eventually, name: ams-precharge, at_ms: 5600, until_ms: 5700, signal: "symbol:ams.g_state_telemetry", value: 1}
  - {check: eventually, name: pre-driven, at_ms: 5600, until_ms: 5700, signal: "pin:ams.PB7", value: high}
  - {check: always, name: link-never-rises, at_ms: 3000, signal: "frame:can_acu.VCU_heartbeat.dc_bus_voltage", value: 0}
  - {check: never, name: no-error-before-the-timeout, at_ms: 0, until_ms: 10600, signal: "symbol:ams.g_state_telemetry", value: 5}
  - {check: never, name: never-run, at_ms: 0, signal: "symbol:ams.g_state_telemetry", value: 3}
  - {check: never, name: air-plus-never-driven, at_ms: 0, signal: "pin:ams.PB5", value: high}
  - {check: eventually, name: precharge-timeout-error, at_ms: 10600, until_ms: 10800, signal: "symbol:ams.g_state_telemetry", value: 5}
  - {check: always, name: reason-fsm-error, at_ms: 10800, signal: "symbol:ams.g_fault_reason_telemetry", value: 12}
  - {check: always, name: air-minus-open, at_ms: 10800, signal: "pin:ams.PB6", value: low}
  - {check: always, name: precharge-open, at_ms: 10800, signal: "pin:ams.PB7", value: low}
