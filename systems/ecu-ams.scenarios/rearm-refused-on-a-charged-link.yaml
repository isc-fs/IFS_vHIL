kind: scenario
system: ecu-ams
description: "TS-3, the re-arm gate on a stranded link: armed to Run on the plant, then the shutdown circuit is cycled faster than the bleed (TSMS off at 11000 ms: the AMS falls to Start, the coils lose their supply and the bleed starts; on again at 11100 ms: the bleed relay re-energises, the link is left near the pack). The AMS reports Start with TSMS on (0x021), the ECU sees the charged link on 0x466 and secures the discharge (PB6) and reports discharge_engaged on 0x100; a DASH_CHG press then is refused (the AMS stays in Start, the press is spent). The ECU releases once its reading is below DischargeReleaseV (10 V), and at the latest after DischargeTimeoutMs (30 s): a press after that arms the car again and reaches Run. The bleed's time constant is uncommissioned, so the second press waits for the ECU's own timeout bound, not for the RC. IFS08-CE-AMS state_machine.hpp:130-171, 267-283; IFS08-CE-ECU discharge.hpp, discharge.cpp:74-83, ecu_config.hpp:540, 548; tests/sim/test_sys_ecu_ams.py test_a_stranded_link_is_drained_before_the_car_re_arms."
virtual_ms: 47500
tags: [beyond-bench]
stimuli:
  - {kind: gpio, name: tsms-on, at_ms: 5500, board: ams, pin: PF9, level: true}
  - {kind: gpio, name: dash-press, at_ms: 5600, board: ams, pin: PF10, level: true}
  - {kind: gpio, name: dash-release, at_ms: 5650, board: ams, pin: PF10, level: false}
  - {kind: gpio, name: sdc-open, at_ms: 11000, board: ams, pin: PF9, level: false}
  - {kind: gpio, name: sdc-closed, at_ms: 11100, board: ams, pin: PF9, level: true}
  - {kind: gpio, name: press-refused, at_ms: 11600, board: ams, pin: PF10, level: true}
  - {kind: gpio, name: press-refused-release, at_ms: 11650, board: ams, pin: PF10, level: false}
  - {kind: gpio, name: press-again, at_ms: 41700, board: ams, pin: PF10, level: true}
  - {kind: gpio, name: press-again-release, at_ms: 41750, board: ams, pin: PF10, level: false}
watch:
  - {kind: symbol, board: ams, name: g_state_telemetry, size: 1, period_ms: 10}
  - {kind: symbol, board: ams, name: g_fault_reason_telemetry, size: 1, period_ms: 10}
  - {kind: symbol, board: ecu, name: g_last_ctrl_state, size: 1, period_ms: 10}
expect:
  - {check: eventually, name: ams-run, at_ms: 5600, until_ms: 10600, signal: "symbol:ams.g_state_telemetry", value: 3}
  - {check: never, name: no-error, at_ms: 0, signal: "symbol:ams.g_state_telemetry", value: 5}
  - {check: eventually, name: start-on-the-sdc-opening, at_ms: 11000, until_ms: 11100, signal: "symbol:ams.g_state_telemetry", value: 0}
  - {check: always, name: link-stranded, at_ms: 11100, until_ms: 11200, signal: "frame:can_acu.VCU_heartbeat.dc_bus_voltage", op: ">", value: 60}
  - {check: eventually, name: ecu-secures, at_ms: 11100, until_ms: 11400, signal: "pin:ecu.PB6", value: high}
  - {check: eventually, name: discharge-engaged-on-0x100, at_ms: 11100, until_ms: 11500, signal: "frame:can_acu.VCU_heartbeat.discharge_engaged", value: 1}
  - {check: always, name: press-refused, at_ms: 11600, until_ms: 13000, signal: "symbol:ams.g_state_telemetry", value: 0}
  - {check: never, name: no-contactor-while-charged, at_ms: 11100, until_ms: 41700, signal: "pin:ams.PB6", value: high}
  - {check: eventually, name: ecu-releases, at_ms: 11400, until_ms: 41400, signal: "pin:ecu.PB6", value: low}
  - {check: eventually, name: link-drained, at_ms: 11400, until_ms: 41400, signal: "frame:can_acu.VCU_heartbeat.dc_bus_voltage", op: "<", value: 10}
  - {check: eventually, name: re-armed-to-run, at_ms: 41700, until_ms: 46700, signal: "symbol:ams.g_state_telemetry", value: 3}
  - {check: always, name: air-plus-above-the-fs-ratio, at_ms: 41700, signal: "plant:ts.air_pos_close_ratio", op: ">=", value: 0.9}
