kind: scenario
system: ecu-ams
description: "An AMS fault puts the ECU in AmsError: the car armed to Run on the tractive-system plant as in car-arms-through-the-ecu (by 10600 ms at the latest, the AMS's PrechargeMaxMs after the press), then 300 A on the pack-current sensor (PF7/PF8 legs, 5 mV/A about a 1.44 V common mode) trips CurrentOverLimit (10) when the AMS's IIR crosses CurrentMaxMa = 185 A; the AMS latches Error and opens the AIRs, its next 0x4A0 (every 500 ms) says Error, and the ECU enters AmsError then and not before and stays there (every AMS frame keeps it fresh); 0x504 ts_active drops. The native test faults a cell (SetCell), which a scenario cannot drive; over-current is the AMS fault a scenario can. The latched Error drops AMS_OK, which opens the shutdown circuit's AMS latch (K5) and so AIR+_VCC, the coil supply the AMS senses on PF9 (the shutdown-circuit plant, TS-2): ams-ok-opens-the-sdc asserts that part. IFS08-CE-AMS safety_predicates.hpp:244, ams_config.hpp:153, current_service.cpp; IFS08-CE-ECU control.cpp:150, 235-236, control_task.cpp:117-120; tests/sim/test_sys_ecu_ams.py test_an_ams_fault_puts_the_ecu_in_ams_error, test_ams_current.py."
virtual_ms: 13500
tags: [beyond-bench]
stimuli:
  - {kind: plant, name: sdc-reset, at_ms: 5400, plant: sdc, set: {reset: true}}
  - {kind: plant, name: sdc-reset-release, at_ms: 5450, plant: sdc, set: {reset: false}}
  - {kind: plant, name: tsms-on, at_ms: 5500, plant: sdc, set: {tsms: true}}
  - {kind: gpio, name: dash-press, at_ms: 5600, board: ams, pin: PF10, level: true}
  - {kind: gpio, name: dash-release, at_ms: 5650, board: ams, pin: PF10, level: false}
  - {kind: analog, name: overcurrent-p, at_ms: 11000, board: ams, pin: PF7, volts: 2.19}
  - {kind: analog, name: overcurrent-n, at_ms: 11000, board: ams, pin: PF8, volts: 0.69}
watch:
  - {kind: symbol, board: ams, name: g_state_telemetry, size: 1, period_ms: 10}
  - {kind: symbol, board: ams, name: g_mode_locked_telemetry, size: 1, period_ms: 10}
  - {kind: symbol, board: ams, name: g_fault_reason_telemetry, size: 1, period_ms: 10}
  - {kind: symbol, board: ecu, name: g_last_ctrl_state, size: 1, period_ms: 10}
expect:
  - {check: always, name: ams-start-before-tsms, at_ms: 4500, until_ms: 5500, signal: "symbol:ams.g_state_telemetry", value: 0}
  - {check: eventually, name: ams-precharge, at_ms: 5600, until_ms: 5700, signal: "symbol:ams.g_state_telemetry", value: 1}
  - {check: eventually, name: ams-run, at_ms: 5600, until_ms: 10600, signal: "symbol:ams.g_state_telemetry", value: 3}
  - {check: eventually, name: ts-active, at_ms: 5600, until_ms: 11000, signal: "frame:can_acu.VCU_ts_active.ts_active", value: 1}
  - {check: never, name: no-ams-error-before, at_ms: 0, until_ms: 11000, signal: "symbol:ams.g_state_telemetry", value: 5}
  - {check: never, name: no-ecu-ams-error-before-the-report, at_ms: 0, until_ms: 12000, signal: "symbol:ecu.g_last_ctrl_state", value: 6}
  - {check: eventually, name: ams-over-current-error, at_ms: 11600, until_ms: 11950, signal: "symbol:ams.g_state_telemetry", value: 5}
  - {check: always, name: reason-over-limit, at_ms: 11950, signal: "symbol:ams.g_fault_reason_telemetry", value: 10}
  - {check: always, name: air-plus-open, at_ms: 11950, signal: "pin:ams.PB5", value: low}
  - {check: always, name: air-minus-open, at_ms: 11950, signal: "pin:ams.PB6", value: low}
  - {check: eventually, name: error-on-can, at_ms: 11600, until_ms: 12450, signal: "frame:can_acu.AMS_status.fsm_state", value: 5}
  - {check: eventually, name: ecu-ams-error, at_ms: 12000, until_ms: 12500, signal: "symbol:ecu.g_last_ctrl_state", value: 6}
  - {check: always, name: ecu-held-in-ams-error, at_ms: 12500, signal: "symbol:ecu.g_last_ctrl_state", value: 6}
  - {check: always, name: ts-inactive, at_ms: 12700, signal: "frame:can_acu.VCU_ts_active.ts_active", value: 0}
  - {check: eventually, name: airs-open-on-the-plant, at_ms: 11600, until_ms: 12000, signal: "plant:ts.air_pos_closed", value: 0}
