kind: scenario
system: ecu-ams
description: "M9 prep (#318), the current sensor on physics: armed to Run, the inverter draws 100 A DC from 11 s to 14 s (the plant's i_inverter_dc). The pack carries it (the AIRs closed), the plant puts it on the SSA-2-250A's legs (catalog/models/ssa-2-250a.yaml: 1.44 V +/- 2.5 mV/A each), and the AMS's filtered reading (0x135 current_accu_dA, IIR tau ~800 ms) follows it up and back. The vHIL's ADC is ideal, while the AMS is calibrated for the car's (CurrentMvPerAmpe1 46, CurrentZeroCount 2054: the car's ADC reads 5 mV/A as 0.924x, ams_config.hpp:784-797), so the AMS reads ~1.087 x I - 2.1 A here (isc-fs/IFS_vHIL#320): the expects allow that, sign and scale must hold."
virtual_ms: 18000
tags: [beyond-bench]
stimuli:
  - {kind: plant, name: sdc-reset, at_ms: 5400, plant: sdc, set: {reset: true}}
  - {kind: plant, name: sdc-reset-release, at_ms: 5450, plant: sdc, set: {reset: false}}
  - {kind: plant, name: tsms-on, at_ms: 5500, plant: sdc, set: {tsms: true}}
  - {kind: gpio, name: dash-press, at_ms: 5600, board: ams, pin: PF10, level: true}
  - {kind: gpio, name: dash-release, at_ms: 5650, board: ams, pin: PF10, level: false}
  - {kind: plant, name: inverter-draws-100a, at_ms: 11000, plant: ts, set: {i_inverter_dc: 100}}
  - {kind: plant, name: inverter-stops, at_ms: 14000, plant: ts, set: {i_inverter_dc: 0}}
watch:
  - {kind: symbol, board: ams, name: g_state_telemetry, size: 1, period_ms: 10}
  - {kind: symbol, board: ams, name: g_fault_reason_telemetry, size: 1, period_ms: 10}
expect:
  - {check: eventually, name: ams-run, at_ms: 5600, until_ms: 10600, signal: "symbol:ams.g_state_telemetry", value: 3}
  - {check: always, name: reads-zero-at-rest, at_ms: 3000, until_ms: 11000, signal: "frame:can_acu.ACU_currents.current_accu_dA", op: "<=", value: 5}
  - {check: always, name: reads-zero-at-rest-low, at_ms: 3000, until_ms: 11000, signal: "frame:can_acu.ACU_currents.current_accu_dA", op: ">=", value: -5}
  - {check: eventually, name: the-pack-carries-100a, at_ms: 11000, until_ms: 11001, signal: "plant:ts.i_pack", value: 100}
  - {check: eventually, name: reads-the-pack-current, at_ms: 12500, until_ms: 14000, signal: "frame:can_acu.ACU_currents.current_accu_dA", op: ">=", value: 95}
  - {check: never, name: not-over-reading, at_ms: 11000, signal: "frame:can_acu.ACU_currents.current_accu_dA", op: ">", value: 115}
  - {check: eventually, name: sign-is-discharge, at_ms: 11000, until_ms: 11500, signal: "frame:can_acu.ACU_currents.current_accu_dA", op: ">", value: 20}
  - {check: eventually, name: back-to-zero, at_ms: 16500, until_ms: 18000, signal: "frame:can_acu.ACU_currents.current_accu_dA", op: "<=", value: 5}
  - {check: never, name: no-error, at_ms: 0, signal: "symbol:ams.g_state_telemetry", value: 5}
