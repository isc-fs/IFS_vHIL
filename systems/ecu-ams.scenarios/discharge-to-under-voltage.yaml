kind: scenario
system: ecu-ams
description: "M9 prep (#318), the pack on physics: a 15 % pack (the plant's soc_init) with one weak element (index 40 at 80 % capacity, IFSSIM#669 §4's weak cell) armed to Run, then the inverter draws 60 A DC from 11 s (the plant's scripted i_inverter_dc; the IFSSIM powertrain's in M9). The elements sag by i R0 and their RC and run down their OCV curve (VTC6, TFM_RMG's fit; catalog/plants/tractive-system.yaml), the weak one first; when the pack's minimum cell stays under CellUnderVoltageMv (2800 mV) for CellFaultConfirmTicks (25 x 10 ms), the AMS latches Error, reason CellUnderVoltage (4), opens the AIRs, and the current stops. IFS08-CE-AMS ams_config.hpp:22, 231; safety_predicates.hpp:213-221. The AMS acts on the plant's cells within its own confirm time: the plant's minimum never goes 50 mV below the threshold first."
virtual_ms: 40000
tags: [beyond-bench]
stimuli:
  - {kind: plant, name: pack-at-15-percent, at_ms: 0, plant: ts, set: {soc_init: 0.15}}
  - {kind: plant, name: weak-element, at_ms: 0, plant: ts, set: {weak_cell: 40, weak_cell_capacity: 0.8}}
  - {kind: plant, name: sdc-reset, at_ms: 5400, plant: sdc, set: {reset: true}}
  - {kind: plant, name: sdc-reset-release, at_ms: 5450, plant: sdc, set: {reset: false}}
  - {kind: plant, name: tsms-on, at_ms: 5500, plant: sdc, set: {tsms: true}}
  - {kind: gpio, name: dash-press, at_ms: 5600, board: ams, pin: PF10, level: true}
  - {kind: gpio, name: dash-release, at_ms: 5650, board: ams, pin: PF10, level: false}
  - {kind: plant, name: inverter-draws-60a, at_ms: 11000, plant: ts, set: {i_inverter_dc: 60}}
watch:
  - {kind: symbol, board: ams, name: g_state_telemetry, size: 1, period_ms: 10}
  - {kind: symbol, board: ams, name: g_fault_reason_telemetry, size: 1, period_ms: 10}
expect:
  - {check: eventually, name: ams-run, at_ms: 5600, until_ms: 10600, signal: "symbol:ams.g_state_telemetry", value: 3}
  - {check: always, name: no-error-at-rest, at_ms: 0, until_ms: 11000, signal: "symbol:ams.g_state_telemetry", op: "!=", value: 5}
  - {check: eventually, name: the-pack-carries-it, at_ms: 11000, until_ms: 11100, signal: "plant:ts.i_pack", value: 60}
  - {check: eventually, name: cells-reach-the-threshold, at_ms: 11000, until_ms: 39000, signal: "plant:ts.v_cell_min", op: "<", value: 2.8}
  - {check: eventually, name: ams-under-voltage, at_ms: 11500, until_ms: 39500, signal: "symbol:ams.g_state_telemetry", value: 5}
  - {check: eventually, name: reason-under-voltage, at_ms: 11500, until_ms: 39500, signal: "symbol:ams.g_fault_reason_telemetry", value: 4}
  - {check: always, name: latched-under-voltage, at_ms: 39500, signal: "symbol:ams.g_fault_reason_telemetry", value: 4}
  - {check: never, name: the-ams-acts-in-time, at_ms: 0, signal: "plant:ts.v_cell_min", op: "<", value: 2.75}
  - {check: eventually, name: min-cell-on-can, at_ms: 11500, until_ms: 39500, signal: "frame:can_acu.AMS_status.min_cell_mV", op: "<", value: 2800}
  - {check: eventually, name: current-stops, at_ms: 11500, until_ms: 39900, signal: "plant:ts.i_pack", value: 0}
