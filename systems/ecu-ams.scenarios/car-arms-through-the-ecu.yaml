kind: scenario
system: ecu-ams
description: "The car arms through the ECU's heartbeat, both boards real, on the tractive-system plant (M8, systems/ecu-ams.yaml plants: ts): the inverter's DC link (0x466 on can_inv, from the plant) reaches the AMS only as the ECU relays it on 0x100 (dc_bus_voltage, dc_bus_valid). TSMS and a DASH_CHG press lock Car mode and arm Precharge (AIR- and PRE close); the link charges through the precharge resistor, and at 95 % of the cell sum the AMS closes AIR+ and opens PRE (Run); its 0x020 ok_precharge takes the ECU from Precharge to WaitStartBrake and 0x504 ts_active to 1, held. AIR+'s contact closes above the FS rule's 90 %. Neither board errors. The plant's parameters are uncommissioned (catalog/plants/tractive-system.yaml): times after the press are bounded by the AMS's own PrechargeMaxMs (5000), not by the RC curve. IFS08-CE-ECU control_task.cpp:117-120, 306-334, control.cpp:155-160; IFS08-CE-AMS state_machine.hpp:117-128, 308-314, 366, ams_config.hpp:190; tests/sim/test_plant_ts.py."
virtual_ms: 11000
tags: [beyond-bench]
stimuli:
  - {kind: plant, name: sdc-reset, at_ms: 5400, plant: sdc, set: {reset: true}}
  - {kind: plant, name: sdc-reset-release, at_ms: 5450, plant: sdc, set: {reset: false}}
  - {kind: plant, name: tsms-on, at_ms: 5500, plant: sdc, set: {tsms: true}}
  - {kind: gpio, name: dash-press, at_ms: 5600, board: ams, pin: PF10, level: true}
  - {kind: gpio, name: dash-release, at_ms: 5650, board: ams, pin: PF10, level: false}
watch:
  - {kind: symbol, board: ams, name: g_state_telemetry, size: 1, period_ms: 10}
  - {kind: symbol, board: ams, name: g_mode_locked_telemetry, size: 1, period_ms: 10}
  - {kind: symbol, board: ecu, name: g_last_ctrl_state, size: 1, period_ms: 10}
expect:
  - {check: never, name: no-ams-error, at_ms: 0, signal: "symbol:ams.g_state_telemetry", value: 5}
  - {check: never, name: no-ecu-ams-error, at_ms: 0, signal: "symbol:ecu.g_last_ctrl_state", value: 6}
  - {check: eventually, name: link-relayed-drained, at_ms: 2500, until_ms: 3000, signal: "frame:can_acu.VCU_heartbeat.dc_bus_valid", value: 1}
  - {check: always, name: link-drained-before-arm, at_ms: 3000, until_ms: 5600, signal: "frame:can_acu.VCU_heartbeat.dc_bus_voltage", value: 0}
  - {check: always, name: ts-inactive-before-arm, at_ms: 3000, until_ms: 5600, signal: "frame:can_acu.VCU_ts_active.ts_active", value: 0}
  - {check: never, name: ecu-waits-for-the-ams, at_ms: 3000, until_ms: 5700, signal: "symbol:ecu.g_last_ctrl_state", value: 2}
  - {check: always, name: ams-start-before-tsms, at_ms: 4500, until_ms: 5500, signal: "symbol:ams.g_state_telemetry", value: 0}
  - {check: eventually, name: ams-precharge, at_ms: 5600, until_ms: 5700, signal: "symbol:ams.g_state_telemetry", value: 1}
  - {check: eventually, name: precharge-ramp, at_ms: 5600, until_ms: 10600, signal: "frame:can_acu.VCU_heartbeat.dc_bus_voltage", op: ">=", value: 100}
  - {check: eventually, name: ams-run, at_ms: 5600, until_ms: 10600, signal: "symbol:ams.g_state_telemetry", value: 3}
  - {check: always, name: car-mode, at_ms: 5700, signal: "symbol:ams.g_mode_locked_telemetry", value: 1}
  - {check: always, name: air-plus-above-the-fs-ratio, at_ms: 5600, signal: "plant:ts.air_pos_close_ratio", op: ">=", value: 0.9}
  - {check: eventually, name: link-relayed-charged, at_ms: 5600, until_ms: 10700, signal: "frame:can_acu.VCU_heartbeat.dc_bus_voltage", op: ">=", value: 351}
  - {check: eventually, name: ecu-wait-start-brake, at_ms: 5600, until_ms: 10800, signal: "symbol:ecu.g_last_ctrl_state", value: 2}
  - {check: eventually, name: ts-active, at_ms: 5600, until_ms: 10800, signal: "frame:can_acu.VCU_ts_active.ts_active", value: 1}
  - {check: always, name: ts-active-held, at_ms: 10800, signal: "frame:can_acu.VCU_ts_active.ts_active", value: 1}
  - {check: always, name: air-plus-closed, at_ms: 10700, signal: "pin:ams.PB5", value: high}
  - {check: always, name: air-minus-closed, at_ms: 10700, signal: "pin:ams.PB6", value: high}
  - {check: always, name: precharge-open-in-run, at_ms: 10700, signal: "pin:ams.PB7", value: low}
  - {check: always, name: ams-ok, at_ms: 4500, signal: "pin:ams.PB4", value: high}
