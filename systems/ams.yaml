kind: system
id: ams
description: >-
  One AMS (a MainLite on the AMS backplane) on the ACU bus, with its battery: the
  LTC6820/LTC6811 chain of 5 modules x 2 ICs on SPI1. What IFS_HIL's AMS
  suites expect from bench-01 slot 2 plus its Pico LTC emulator.
time:
  quantum_s: 0.0005
boards:
  # A MainLite in the AMS role: the AMS firmware, node 0x2, flashed over
  # FDCAN1 (the role's, catalog/boards/mainlite.yaml). It boots through its
  # CAN bootloader, then jumps to the app after the 2 s auto-jump window, as
  # on the car.
  ams: {board: mainlite, role: ams}
buses:
  can_acu: {kind: can, nodes: [ams.FDCAN1], host_netdev: can2}  # CAN_H/L_ACU, J1.9/J1.10, H/L swapped (docs/backplanes/ams.md)
devices:
  # LTC6820 on SPI1 (chip select PB9), then 5 modules x (upper + lower
  # LTC6811) = 10 ICs on its isoSPI chain: cells0 (module 0 upper) nearest.
  isospi: {model: ltc6820, spi: ams.SPI1, cs: ams.PB9}  # SPI1 + LTC6820_CS -> U4 LTC6820 (docs/backplanes/ams.md)
  cells: {model: ltc6811, attach: isospi, count: 10}
  sd: {model: sd-card, sdmmc: ams.SDMMC1}
  # The MainLite's BMI088 on I2C2 (accelerometer 0x18, gyroscope 0x68:
  # SDO1/SDO2 to GND, ams_config.hpp ImuAccAddr7b/ImuGyrAddr7b), which
  # the AMS's ImuTask samples at 100 Hz into IMUnnnn.CSV on the card.
  imu: {model: bmi088, i2c: ams.I2C2}
  # The car's current sensors, at 0 A: the pack's SSA-2 differential pair on
  # ADC3 INP3/INN3 and the DC-DC's ACS758 on INP11 (ams_config.hpp, current
  # sensor calibration). Undriven, the legs would read 0 V, which the
  # firmware takes for a disconnected sensor.
  pack_current: {model: ssa-2-250a, outputs: {out_p: ams.PF7, out_n: ams.PF8}}  # S_CURRENT_P/N -> J4.3/J4.2 (docs/backplanes/ams.md)
  dcdc_current: {model: acs758lcb-050b, outputs: {out: ams.PC1}}  # S_CURRENT_DCDC -> J3.5, not sampled on AMS dev (docs/backplanes/ams.md)
port:
  # The co-simulation port (vhil/cosim.py): the cockpit and the contactors
  # around the AMS. TSMS and DASH_CHG are inputs the driver works; AIR-,
  # AIR+, precharge and AMS_OK are the relay drivers the AMS commands
  # (IFS08-CE-AMS main.h:70-83, relay_driver.cpp). SafetyTask samples and
  # drives them every 10 ms (ams_config.hpp:193 SafetyPeriodMs).
  step_ms: 10
  signals:
    tsms:      {gpio_in: ams.PF9}    # TSMS_FIL, a digital input (docs/backplanes/ams.md)
    dash_chg:  {gpio_in: ams.PF10}   # RST_PIL_FIL, the firmware's DASH_CHG (docs/backplanes/ams.md)
    ams_ok:    {gpio_out: ams.PB4}   # AMS_OK -> K5, J1.4 (docs/backplanes/ams.md)
    air_p:     {gpio_out: ams.PB5}   # AIR+ coil low side, J11.6 (docs/backplanes/ams.md)
    air_n:     {gpio_out: ams.PB6}   # AIR-, J11.5 (docs/backplanes/ams.md)
    precharge: {gpio_out: ams.PB7}   # PRECHARGE, J11.4 (docs/backplanes/ams.md)
bench:
  power:
    # Slot 2: relay = TCA 0x20 port 0 pin 1, current monitor INA 0x41
    # (bench-01: 118-128 mA alive).
    - {board: ams, slot: 2, relay: {addr: 0x20, port: 0, pin: 1}, ina_addr: 0x41, current_A: 0.12}
  dac_routes:
    # bench DAC4 -> the pack-current pair (IFS_HIL bench-01.yaml
    # routing.pack_current). When a test drives it, it overrides the
    # pack_current sensor's output.
    - {dac: 3, channel: 0, to: ams.PF7}  # S_CURRENT_P (docs/backplanes/ams.md)
    - {dac: 3, channel: 1, to: ams.PF8}  # S_CURRENT_N (docs/backplanes/ams.md)
  gpio_routes:
    # IOEXP2 (TCA 0x21) port 1 -> the cockpit inputs (IFS_HIL bench-01.yaml
    # routing.tsms / routing.dash_chg).
    - {tca: 0x21, port: 1, pin: 0, to: ams.PF9}    # P10 -> TSMS_FIL (docs/backplanes/ams.md)
    - {tca: 0x21, port: 1, pin: 1, to: ams.PF10}   # P11 -> RST_PIL_FIL, DASH_CHG (docs/backplanes/ams.md)
  adc_routes:
    # bench ADC3 (MCP3208 idx 2) ch0-3 tap the relay drivers (IFS_HIL
    # bench-01.yaml routing.relay_readback).
    - {adc: 2, channel: 0, from: ams.PB4}  # AMS_OK (docs/backplanes/ams.md)
    - {adc: 2, channel: 1, from: ams.PB5}  # AIR+ (docs/backplanes/ams.md)
    - {adc: 2, channel: 2, from: ams.PB6}  # AIR- (docs/backplanes/ams.md)
    - {adc: 2, channel: 3, from: ams.PB7}  # PRECHARGE (docs/backplanes/ams.md)
