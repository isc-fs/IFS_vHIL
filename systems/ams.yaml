kind: system
id: ams
description: >-
  One AMS (a MainLite on the AMS backplane) on the ACU bus, with its battery: the
  LTC6820/LTC6811 chain of 5 modules x 2 ICs on SPI1. What IFS_HIL's AMS
  suites expect from bench-01 slot 2 plus its Pico LTC emulator.
time:
  quantum_s: 0.0005
boards:
  ams: {board: mainlite, firmware: ams}
buses:
  can_acu: {kind: can, nodes: [ams.FDCAN1], host_netdev: can2}
devices:
  # LTC6820 on SPI1 (chip select PB9), then 5 modules x (upper + lower
  # LTC6811) = 10 ICs on its isoSPI chain: cells0 (module 0 upper) nearest.
  isospi: {model: ltc6820, spi: ams.SPI1, cs: ams.PB9}
  cells: {model: ltc6811, attach: isospi, count: 10}
  sd: {model: sd-card, sdmmc: ams.SDMMC1}
  # The MainLite's BMI088 on I2C2 (accelerometer 0x18, gyroscope 0x68:
  # SDO1/SDO2 to GND, ams_config.hpp ImuAccAddr7b/ImuGyrAddr7b), which
  # the AMS's ImuTask samples at 100 Hz into IMUnnnn.CSV on the card.
  imu: {model: bmi088, i2c: ams.I2C2}
  # The car's current sensors, at 0 A: the pack's SSA-2 differential pair on
  # ADC3 INP3/INN3 and the DC-DC's ACS758 on INP11 (ams_config.hpp, current
  # sensor calibration). Undriven, the legs would read 0 V, which the
  # firmware takes for a disconnected sensor.
  pack_current: {model: ssa-2-250a, outputs: {out_p: ams.PF7, out_n: ams.PF8}}
  dcdc_current: {model: acs758lcb-050b, outputs: {out: ams.PC1}}
bench:
  power:
    # Slot 2: relay = TCA 0x20 port 0 pin 1, current monitor INA 0x41
    # (bench-01: 118-128 mA alive).
    - {board: ams, slot: 2, relay: {addr: 0x20, port: 0, pin: 1}, ina_addr: 0x41, current_A: 0.12}
  # Not yet mapped: the bench's DAC4 pack-current pair and the TSMS /
  # DASH_CHG GPIO inputs.
